    <script>
    (function(){
      var spouse = "no";

      function fmtYen(n){
        var sign = n < 0 ? "−" : "";
        return sign + "¥" + Math.round(Math.abs(n)).toLocaleString("ja-JP");
      }

      // 給与所得控除（2020年分以降）
      function salaryDeduction(income){
        if (income <= 550000) return income;
        if (income <= 1625000) return 550000;
        if (income <= 1800000) return income * 0.4 - 100000;
        if (income <= 3600000) return income * 0.3 + 80000;
        if (income <= 6600000) return income * 0.2 + 440000;
        if (income <= 8500000) return income * 0.1 + 1100000;
        return 1950000;
      }

      // 所得税 速算表（2015年分以降）
      function incomeTaxByBracket(taxable){
        var t = taxable;
        if (t <= 1950000) return t * 0.05;
        if (t <= 3300000) return t * 0.10 - 97500;
        if (t <= 6950000) return t * 0.20 - 427500;
        if (t <= 9000000) return t * 0.23 - 636000;
        if (t <= 18000000) return t * 0.33 - 1536000;
        if (t <= 40000000) return t * 0.40 - 2796000;
        return t * 0.45 - 4796000;
      }

      function floor1000(n){ return Math.floor(n / 1000) * 1000; }

      function calculate(){
        var salary = parseFloat(document.getElementById("itSalary").value) || 0;
        var withheld = parseFloat(document.getElementById("itWithheld").value) || 0;
        var sideIncome = parseFloat(document.getElementById("itSideIncome").value) || 0;
        var sideExpense = parseFloat(document.getElementById("itSideExpense").value) || 0;
        var dependents = parseInt(document.getElementById("itDependents").value, 10) || 0;
        var socialIns = parseFloat(document.getElementById("itSocialIns").value) || 0;
        var lifeIns = Math.min(parseFloat(document.getElementById("itLifeIns").value) || 0, 120000);
        var eqIns = Math.min(parseFloat(document.getElementById("itEqIns").value) || 0, 50000);
        var taxCredit = parseFloat(document.getElementById("itTaxCredit").value) || 0;

        var salaryIncome = Math.max(0, salary - salaryDeduction(salary));
        var sideProfit = Math.max(0, sideIncome - sideExpense);
        var totalIncome = salaryIncome + sideProfit;

        // 所得控除（所得税用：基礎控除48万）
        var basicDeduction = 480000;
        var spouseDeduction = (spouse === "yes") ? 380000 : 0;
        var dependentDeduction = dependents * 380000;
        var deductionsIncomeTax = basicDeduction + spouseDeduction + dependentDeduction + socialIns + lifeIns + eqIns;

        var taxableIncome = Math.max(0, floor1000(totalIncome - deductionsIncomeTax));
        var calcIncomeTax = Math.max(0, incomeTaxByBracket(taxableIncome));
        var afterCreditTax = Math.max(0, calcIncomeTax - taxCredit);
        var reconstructionTax = afterCreditTax * 0.021; // 復興特別所得税 2.1%
        var totalIncomeTax = Math.round(afterCreditTax + reconstructionTax);
        var diffIncomeTax = totalIncomeTax - withheld; // +は追加納付、−は還付

        // 住民税（概算：基礎控除43万、税率10%＋均等割5,000円）
        var basicDeductionResident = 430000;
        var deductionsResident = basicDeductionResident + spouseDeduction + dependentDeduction + socialIns + lifeIns + eqIns;
        var taxableResident = Math.max(0, floor1000(totalIncome - deductionsResident));
        var residentTax = Math.round(taxableResident * 0.10) + 5000;

        var totalDue = Math.max(0, diffIncomeTax) + residentTax;

        document.getElementById("itIncomeTaxOut").textContent = fmtYen(diffIncomeTax);
        document.getElementById("itResidentTaxOut").textContent = fmtYen(residentTax);
        document.getElementById("itTotalOut").textContent = fmtYen(totalDue);

        var rows = [
          ["合計収入", fmtYen(salary + sideIncome)],
          ["合計所得", fmtYen(totalIncome)],
          ["所得控除（所得税用）", fmtYen(deductionsIncomeTax)],
          ["課税所得", fmtYen(taxableIncome)],
          ["計算所得税", fmtYen(calcIncomeTax)],
          ["控除後所得税", fmtYen(afterCreditTax)],
          ["復興特別所得税", fmtYen(reconstructionTax)],
          ["合計所得税", fmtYen(totalIncomeTax)],
          ["【差引所得税（源泉徴収分差引）】", fmtYen(diffIncomeTax)],
          ["住民税課税所得（概算）", fmtYen(taxableResident)],
          ["【住民税額（概算）】", fmtYen(residentTax)],
          ["【合計納税額の目安】", fmtYen(totalDue)]
        ];
        var body = document.getElementById("itBreakdownBody");
        var html = "";
        rows.forEach(function(r){
          var hl = r[0].indexOf("【") === 0 ? " class=\"hl\"" : "";
          html += "<tr" + hl + "><td>" + r[0] + "</td><td>" + r[1] + "</td></tr>";
        });
        body.innerHTML = html;
      }

      var spouseYes = document.getElementById("itSpouseYes");
      var spouseNo = document.getElementById("itSpouseNo");
      if (spouseYes){
        spouseYes.addEventListener("click", function(){
          spouse = "yes"; spouseYes.classList.add("active"); spouseNo.classList.remove("active"); calculate();
        });
        spouseNo.addEventListener("click", function(){
          spouse = "no"; spouseNo.classList.add("active"); spouseYes.classList.remove("active"); calculate();
        });
      }

      var btn = document.getElementById("itCalcBtn");
      if (btn){
        btn.addEventListener("click", calculate);
        ["itSalary","itWithheld","itSideIncome","itSideExpense","itDependents","itSocialIns","itLifeIns","itEqIns","itTaxCredit"].forEach(function(id){
          var el = document.getElementById(id);
          if (el) el.addEventListener("input", calculate);
          if (el) el.addEventListener("change", calculate);
        });
        calculate();
      }
    })();
    </script>

        backdrop.addEventListener("click", function (event) { if (event.target === backdrop) closeModal(); });
        document.addEventListener("keydown", function (event) { if (event.key === "Escape" && !backdrop.hidden) closeModal(); });
      })();
    </script>
  </div><!-- /page-income-tax -->
