<div id="page-restaurant-list" class="page-view active theme-route" data-no-i18n>
  <div class="restaurant-hero">
    <div>
      <h2>お店リスト</h2>
    </div>
  </div>
  <div class="restaurant-note"><b>掲載について：</b>現在は掲載イメージとしての東京の店舗例です。「正宗」は店の出身地・専門料理／専門分野・公式案内を確認しながら追加する運用をおすすめします。営業日・住所・メニューは変更されるため、来店前に Google Maps または公式情報でご確認ください。</div>
  <div class="restaurant-filters" aria-label="お店の種類で絞り込む" id="rlTypeFilters"></div>
  <div class="restaurant-filters" aria-label="国で絞り込む" id="rlCountryFilters"></div>
  <div class="restaurant-filters restaurant-filters-region" aria-label="地域で絞り込む" id="rlRegionFilters"></div>
  <div class="restaurant-result"><strong id="restaurantCount">0</strong> 件のお店を表示しています <span>東京・掲載例</span></div>
  <div class="restaurant-list" id="restaurantList"></div>

  <div class="rl-modal-backdrop" id="rlBackdrop" hidden>
    <div class="rl-modal" role="dialog" aria-modal="true" aria-labelledby="rlModalTitle">
      <button type="button" class="rl-modal-close" id="rlModalClose" aria-label="閉じる">×</button>
      <div class="rl-modal-body" id="rlModalBody"></div>
    </div>
  </div>

  <div class="rl-lightbox" id="rlLightbox" hidden>
    <button type="button" class="rl-lightbox-nav rl-lightbox-prev" id="rlLightboxPrev" aria-label="前の写真">‹</button>
    <img id="rlLightboxImg" src="" alt="">
    <button type="button" class="rl-lightbox-nav rl-lightbox-next" id="rlLightboxNext" aria-label="次の写真">›</button>
    <div class="rl-lightbox-count" id="rlLightboxCount"></div>
  </div>

  <style>
    .rl-modal-backdrop{position:fixed;inset:0;background:rgba(26,20,16,.55);display:flex;align-items:center;justify-content:center;padding:24px;z-index:200}
    .rl-modal-backdrop[hidden]{display:none}
    .rl-modal{position:relative;background:var(--white,#fff);max-width:480px;width:100%;max-height:82vh;overflow-y:auto;border:1px solid var(--line,#e2d9cf);border-radius:var(--radius-lg,20px);box-shadow:var(--shadow-lg,0 18px 48px rgba(30,22,16,.25))}
    .rl-modal-close{position:sticky;top:8px;float:right;margin:8px 8px 0 0;width:28px;height:28px;border:1px solid var(--line,#e2d9cf);border-radius:50%;background:var(--white,#fff);font-size:16px;line-height:1;cursor:pointer;color:var(--ink-soft,#6b5f56);z-index:1}
    .rl-modal-close:hover{border-color:var(--accent,#b23b2e);color:var(--accent,#b23b2e)}
    .rl-modal-body{padding:6px 20px 20px}
    .rl-m-tags{display:flex;gap:8px;align-items:center;font:700 9.5px "JetBrains Mono",monospace;letter-spacing:.04em;color:var(--accent,#b23b2e);margin-bottom:6px}
    .rl-m-tags span:last-child{color:var(--ink-soft,#6b5f56);font-weight:600}
    .rl-m-name-row{display:flex;align-items:center;gap:9px}
    .rl-m-logo{width:34px;height:34px;border-radius:50%;object-fit:cover;display:block;border:1px solid var(--line,#e2d9cf);flex:0 0 auto}
    .rl-modal-body h3{font-family:"Shippori Mincho",serif;font-size:19px;line-height:1.35;margin:0}
    .rl-m-area{font-size:11px;color:var(--ink-soft,#6b5f56);margin:0 0 12px}
    .rl-m-official{font-size:10.5px;color:var(--ink-soft,#6b5f56);margin:-8px 0 12px}
    .rl-flag{font-size:.85em}
    .rl-m-section{margin:0 0 14px}
    .rl-m-section h4{font-size:10.5px;font-weight:700;letter-spacing:.06em;color:var(--accent,#b23b2e);margin:0 0 6px;text-transform:uppercase}
    .rl-m-section p{font-size:12px;line-height:1.7;color:var(--ink,#2b241f);margin:0}
    .rl-m-info{display:grid;grid-template-columns:84px minmax(0,1fr);gap:8px 10px;margin:0}
    .rl-m-info dt{font-size:10px;font-weight:700;color:var(--ink-soft,#6b5f56);padding-top:1px}
    .rl-m-info dd{font-size:11.5px;line-height:1.6;color:var(--ink,#2b241f);margin:0;overflow-wrap:break-word}
    .rl-m-dish-list{display:flex;flex-wrap:wrap;gap:6px;list-style:none;margin:0;padding:0}
    .rl-m-dish-list li{border:1px solid var(--line,#e2d9cf);border-radius:var(--radius-pill,999px);background:var(--paper-2,#f7f1e8);padding:5px 11px;font-size:11px;color:var(--ink,#2b241f)}
    .rl-m-photos{display:grid;grid-template-columns:repeat(auto-fit,minmax(100px,1fr));gap:6px}
    .rl-m-photos img{width:100%;aspect-ratio:1/1;object-fit:cover;display:block;border-radius:8px;box-shadow:0 4px 12px rgba(40,34,30,.18);cursor:zoom-in}
    .rl-m-map iframe{width:100%;height:150px;border:1px solid var(--line,#e2d9cf);border-radius:var(--radius-sm,8px);display:block}
    .rl-lightbox{position:fixed;inset:0;background:rgba(15,10,6,.85);display:flex;align-items:center;justify-content:center;padding:24px;z-index:300;cursor:zoom-out;touch-action:pan-y}
    .rl-lightbox[hidden]{display:none}
    .rl-lightbox img{max-width:100%;max-height:100%;object-fit:contain;border-radius:var(--radius-md,12px);box-shadow:0 18px 48px rgba(0,0,0,.4);user-select:none;-webkit-user-drag:none}
    .rl-lightbox-nav{position:absolute;top:50%;transform:translateY(-50%);width:44px;height:44px;border:none;border-radius:50%;background:rgba(255,255,255,.12);color:#fff;font-size:26px;line-height:1;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:background .15s ease;z-index:1}
    .rl-lightbox-nav:hover{background:rgba(255,255,255,.24)}
    .rl-lightbox-nav[hidden]{display:none}
    .rl-lightbox-prev{left:10px}
    .rl-lightbox-next{right:10px}
    .rl-lightbox-count{position:absolute;bottom:14px;left:50%;transform:translateX(-50%);color:#fff;font:600 11px "JetBrains Mono",monospace;background:rgba(0,0,0,.35);padding:4px 10px;border-radius:var(--radius-pill,999px)}
    @media(max-width:640px){
      .rl-lightbox-nav{width:38px;height:38px;font-size:22px}
      .rl-lightbox-prev{left:4px}
      .rl-lightbox-next{right:4px}
    }
    .rl-m-links{display:flex;flex-wrap:wrap;gap:6px}
    .rl-m-links a{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--line,#e2d9cf);border-radius:var(--radius-pill,999px);padding:6px 13px;font-size:11px;font-weight:600;color:var(--ink,#2b241f);text-decoration:none}
    .rl-m-links a:hover{border-color:var(--accent,#b23b2e);color:var(--accent,#b23b2e)}
    .rl-m-empty{font-size:11.5px;color:var(--ink-soft,#6b5f56);font-style:italic;margin:0 0 8px}
    .restaurant-card.is-claimed{cursor:pointer}
    .restaurant-card-main{display:flex;gap:14px;align-items:flex-start}
    .restaurant-card-text{flex:1;min-width:0}
    .restaurant-card-thumbs{display:flex;flex-direction:row;gap:8px;flex:0 0 auto;margin-top:8px}
    .restaurant-card-thumbs img{width:56px;height:56px;object-fit:cover;display:block;border-radius:10px;box-shadow:0 3px 10px rgba(40,34,30,.16);transition:transform .15s ease}
    .restaurant-card.is-claimed:hover .restaurant-card-thumbs img{transform:translateY(-2px)}
    @media(min-width:641px){
      .restaurant-card-thumbs{margin-top:12px;gap:10px}
      .restaurant-card-thumbs img{width:64px;height:64px}
    }
    @media(max-width:640px){
      .rl-modal-backdrop{padding:6px}
      .rl-modal{max-height:97vh}
      .rl-modal-body{padding:4px 12px 12px}
      .rl-m-tags{margin-bottom:4px}
      .rl-modal-body h3{font-size:17px;margin:0 0 2px}
      .rl-m-area{margin:0 0 6px}
      .rl-m-section{margin:0 0 8px}
      .rl-m-section h4{margin:0 0 4px}
      .rl-m-section p{line-height:1.5}
      .rl-m-info{grid-template-columns:70px minmax(0,1fr);gap:3px 8px}
      .rl-m-info dt{font-size:9.5px}
      .rl-m-info dd{font-size:11px}
      .rl-m-dish-list li{padding:4px 8px;font-size:10.5px}
      .rl-m-logo{width:30px;height:30px}
      .rl-m-map{margin-bottom:0}
      .rl-m-map iframe{height:180px}
      .rl-m-links a{padding:5px 9px;font-size:10.5px}
    }
  </style>

  <script>
    (function () {
      var dataEl = document.getElementById("restaurantsData");
      var restaurants = dataEl ? JSON.parse(dataEl.textContent) : [];

      function escapeHtml(value) { var el = document.createElement("div"); el.textContent = value == null ? "" : value; return el.innerHTML; }
      function mapEmbedUrl(query) { return "https://www.google.com/maps?q=" + encodeURIComponent(query) + "&output=embed"; }
      function mapLinkUrl(query) { return "https://www.google.com/maps/search/?api=1&query=" + encodeURIComponent(query); }
      function resolvedMapLink(r) { return r.mapUrl || mapLinkUrl(r.mapQuery); }

      var types = ["all"].concat(Array.from(new Set(restaurants.map(function (r) { return r.type || "restaurant"; }))));

      var typeLabels = { all: "すべて", restaurant: "レストラン", beauty: "美容・ネイル", grocery: "物産店" };
      var countryLabels = { all: "すべて" };
      var regionLabels = { all: "全地域" };

      var typeFiltersEl = document.getElementById("rlTypeFilters");
      var countryFiltersEl = document.getElementById("rlCountryFilters");
      var regionFiltersEl = document.getElementById("rlRegionFilters");
      var listEl = document.getElementById("restaurantList");
      var countEl = document.getElementById("restaurantCount");
      var backdrop = document.getElementById("rlBackdrop");
      var modalBody = document.getElementById("rlModalBody");
      var lightbox = document.getElementById("rlLightbox");
      var lightboxImg = document.getElementById("rlLightboxImg");
      var lightboxPrev = document.getElementById("rlLightboxPrev");
      var lightboxNext = document.getElementById("rlLightboxNext");
      var lightboxCount = document.getElementById("rlLightboxCount");
      var lightboxPhotos = [];
      var lightboxIndex = 0;

      var currentType = "all";
      var currentCountry = "all";
      var currentRegion = "all";

      function byType(list) {
        return currentType === "all" ? list : list.filter(function (r) { return (r.type || "restaurant") === currentType; });
      }

      function renderFilters() {
        typeFiltersEl.innerHTML = types.map(function (t) {
          var label = typeLabels[t] || t;
          var count = t === "all" ? restaurants.length : restaurants.filter(function (r) { return (r.type || "restaurant") === t; }).length;
          return '<button type="button" class="' + (t === currentType ? "active" : "") + '" data-type="' + escapeHtml(t) + '">' + escapeHtml(label) + " <small>" + count + "</small></button>";
        }).join("");

        var scoped = byType(restaurants);
        var countries = ["all"].concat(Array.from(new Set(scoped.map(function (r) { return r.country; }))));
        var regions = ["all"].concat(Array.from(new Set(scoped.map(function (r) { return r.region; }))));
        if (countries.indexOf(currentCountry) === -1) currentCountry = "all";
        if (regions.indexOf(currentRegion) === -1) currentRegion = "all";

        countryFiltersEl.innerHTML = countries.map(function (c) {
          var label = countryLabels[c] || c;
          var count = c === "all" ? scoped.length : scoped.filter(function (r) { return r.country === c; }).length;
          return '<button type="button" class="' + (c === currentCountry ? "active" : "") + '" data-country="' + escapeHtml(c) + '">' + escapeHtml(label) + (c === "all" ? " <small>" + count + "</small>" : "") + "</button>";
        }).join("");
        regionFiltersEl.innerHTML = regions.map(function (r) {
          var label = regionLabels[r] || r;
          return '<button type="button" class="' + (r === currentRegion ? "active" : "") + '" data-region="' + escapeHtml(r) + '">' + escapeHtml(label) + "</button>";
        }).join("");

        typeFiltersEl.querySelectorAll("button").forEach(function (btn) {
          btn.addEventListener("click", function () {
            currentType = btn.dataset.type;
            currentCountry = "all";
            currentRegion = "all";
            renderFilters();
            renderList();
          });
        });
        countryFiltersEl.querySelectorAll("button").forEach(function (btn) {
          btn.addEventListener("click", function () {
            currentCountry = btn.dataset.country;
            renderFilters();
            renderList();
          });
        });
        regionFiltersEl.querySelectorAll("button").forEach(function (btn) {
          btn.addEventListener("click", function () {
            currentRegion = btn.dataset.region;
            renderFilters();
            renderList();
          });
        });
      }

      function renderList() {
        var visible = byType(restaurants).filter(function (r) {
          return (currentCountry === "all" || r.country === currentCountry) && (currentRegion === "all" || r.region === currentRegion);
        }).sort(function (a, b) {
          return (b.claimed ? 1 : 0) - (a.claimed ? 1 : 0);
        });
        countEl.textContent = String(visible.length);
        listEl.innerHTML = visible.map(function (r) {
          var thumb = r.claimed && r.photos && r.photos.length
            ? '<div class="restaurant-card-thumbs">' + r.photos.slice(0, 2).map(function (src) {
                return '<img src="' + escapeHtml(src) + '" alt="' + escapeHtml(r.name) + '" loading="lazy">';
              }).join("") + "</div>"
            : "";
          return '<article class="restaurant-card' + (r.claimed ? " is-claimed" : "") + '" data-id="' + escapeHtml(r.id) + '">' +
            '<div class="restaurant-card-top"><span class="restaurant-country">' + escapeHtml(r.country) + '</span><span>' + escapeHtml(r.category) + '</span></div>' +
            '<div class="restaurant-card-main">' +
              '<div class="restaurant-card-text"><h3>' + escapeHtml(r.name) + (r.flag ? ' <span class="rl-flag">' + escapeHtml(r.flag) + '</span>' : '') + '</h3><p>' + escapeHtml(r.description) + '</p></div>' +
              thumb +
            '</div>' +
            '<div class="restaurant-card-bottom"><span>' + escapeHtml(r.area) + '</span><a href="' + resolvedMapLink(r) + '" target="_blank" rel="noopener noreferrer" data-maplink>Google Maps ↗</a></div>' +
            "</article>";
        }).join("");

        listEl.querySelectorAll(".restaurant-card.is-claimed").forEach(function (card) {
          card.addEventListener("click", function (event) {
            if (event.target.closest("[data-maplink]")) return;
            openModal(card.dataset.id);
          });
        });
      }

      function openModal(id) {
        var r = restaurants.filter(function (item) { return item.id === id; })[0];
        if (!r) return;

        var infoRows = [
          r.hours ? ["営業時間", r.hours] : null,
          r.closedDays ? ["定休日", r.closedDays] : null,
          r.phone ? ["電話番号", r.phone] : null,
          r.priceRange ? ["価格帯", r.priceRange] : null,
          r.dietary ? ["食事制限への対応", r.dietary] : null,
          r.payment && r.payment.length ? ["支払い方法", r.payment.join("、")] : null,
          r.languages ? ["対応言語", r.languages] : null
        ].filter(Boolean);
        var infoSection = infoRows.length
          ? '<div class="rl-m-section"><h4>基本情報</h4><dl class="rl-m-info">' +
            infoRows.map(function (row) { return "<dt>" + escapeHtml(row[0]) + "</dt><dd>" + escapeHtml(row[1]) + "</dd>"; }).join("") +
            "</dl></div>"
          : "";

        var tablesSection = r.tables
          ? '<div class="rl-m-section"><h4>席・テーブル</h4><p>' + escapeHtml(r.tables) + "</p></div>"
          : "";

        var dishesSection = r.signatureDishes && r.signatureDishes.length
          ? '<div class="rl-m-section"><h4>招牌菜</h4><ul class="rl-m-dish-list">' + r.signatureDishes.map(function (d) { return "<li>" + escapeHtml(d) + "</li>"; }).join("") + "</ul></div>"
          : "";

        var photosSection = r.photos && r.photos.length
          ? '<div class="rl-m-section"><h4>写真</h4><div class="rl-m-photos">' + r.photos.map(function (src) { return '<img src="' + escapeHtml(src) + '" alt="' + escapeHtml(r.name) + '" loading="lazy">'; }).join("") + "</div></div>"
          : "";

        var links = [
          r.website ? ["公式サイト", r.website] : null,
          r.instagram ? ["Instagram", r.instagram] : null,
          r.threads ? ["Threads", r.threads] : null,
          r.line ? ["LINE予約", r.line] : null,
          r.x ? ["X", r.x] : null,
          r.facebook ? ["Facebook", r.facebook] : null,
          r.tabelog ? ["食べログ", r.tabelog] : null
        ].filter(Boolean);
        var linksSection = '<div class="rl-m-section"><h4>リンク</h4>' +
          (links.length ? "" : '<p class="rl-m-empty">公式サイトやSNSのリンクは準備中です。</p>') +
          '<div class="rl-m-links">' +
          links.map(function (l) { return '<a href="' + escapeHtml(l[1]) + '" target="_blank" rel="noopener noreferrer">' + escapeHtml(l[0]) + "</a>"; }).join("") +
          '<a href="' + resolvedMapLink(r) + '" target="_blank" rel="noopener noreferrer">Google Maps ↗</a>' +
          "</div></div>";

        var logoHtml = r.logo ? '<img class="rl-m-logo" src="' + escapeHtml(r.logo) + '" alt="" loading="lazy" onerror="this.remove()">' : "";
        var flagHtml = r.flag ? ' <span class="rl-flag">' + escapeHtml(r.flag) + '</span>' : "";
        var officialNameHtml = r.officialName ? '<p class="rl-m-official">' + escapeHtml(r.officialName) + '</p>' : "";

        modalBody.innerHTML =
          '<div class="rl-m-tags"><span>' + escapeHtml(r.country) + "</span><span>" + escapeHtml(r.category) + "</span></div>" +
          '<div class="rl-m-name-row">' +
            logoHtml +
            "<h3 id=\"rlModalTitle\">" + escapeHtml(r.name) + flagHtml + "</h3>" +
          "</div>" +
          '<p class="rl-m-area">' + escapeHtml(r.area) + " · " + escapeHtml(r.region) + "</p>" +
          officialNameHtml +
          '<div class="rl-m-section"><h4>お店紹介</h4><p>' + escapeHtml(r.intro || r.description) + "</p></div>" +
          infoSection + tablesSection + dishesSection + linksSection + photosSection +
          '<div class="rl-m-section rl-m-map"><h4>地図</h4><iframe src="' + mapEmbedUrl(r.mapQuery) + '" loading="lazy" referrerpolicy="no-referrer-when-downgrade" allowfullscreen></iframe></div>';

        var photoEls = modalBody.querySelectorAll(".rl-m-photos img");
        photoEls.forEach(function (img, index) {
          img.addEventListener("click", function () { openLightbox(r.photos, r.name, index); });
        });

        backdrop.hidden = false;
        document.body.style.overflow = "hidden";
      }

      function openLightbox(photos, alt, index) {
        lightboxPhotos = photos || [];
        lightboxIndex = index || 0;
        renderLightbox(alt);
        lightbox.hidden = false;
      }

      function renderLightbox(alt) {
        lightboxImg.src = lightboxPhotos[lightboxIndex];
        lightboxImg.alt = alt || "";
        var multi = lightboxPhotos.length > 1;
        lightboxPrev.hidden = !multi;
        lightboxNext.hidden = !multi;
        lightboxCount.hidden = !multi;
        if (multi) lightboxCount.textContent = (lightboxIndex + 1) + " / " + lightboxPhotos.length;
      }

      function showPrevPhoto() {
        if (!lightboxPhotos.length) return;
        lightboxIndex = (lightboxIndex - 1 + lightboxPhotos.length) % lightboxPhotos.length;
        renderLightbox(lightboxImg.alt);
      }

      function showNextPhoto() {
        if (!lightboxPhotos.length) return;
        lightboxIndex = (lightboxIndex + 1) % lightboxPhotos.length;
        renderLightbox(lightboxImg.alt);
      }

      function closeLightbox() {
        lightbox.hidden = true;
        lightboxImg.src = "";
        lightboxPhotos = [];
      }

      function closeModal() {
        backdrop.hidden = true;
        document.body.style.overflow = "";
      }

      document.getElementById("rlModalClose").addEventListener("click", closeModal);
      backdrop.addEventListener("click", function (event) { if (event.target === backdrop) closeModal(); });
      lightbox.addEventListener("click", function (event) {
        if (event.target === lightbox || event.target === lightboxImg) closeLightbox();
      });
      lightboxPrev.addEventListener("click", function (event) { event.stopPropagation(); showPrevPhoto(); });
      lightboxNext.addEventListener("click", function (event) { event.stopPropagation(); showNextPhoto(); });
      document.addEventListener("keydown", function (event) {
        if (!lightbox.hidden) {
          if (event.key === "Escape") { closeLightbox(); return; }
          if (event.key === "ArrowLeft") { showPrevPhoto(); return; }
          if (event.key === "ArrowRight") { showNextPhoto(); return; }
          return;
        }
        if (event.key === "Escape" && !backdrop.hidden) closeModal();
      });

      var touchStartX = null;
      var touchStartY = null;
      lightbox.addEventListener("touchstart", function (event) {
        if (event.touches.length !== 1) return;
        touchStartX = event.touches[0].clientX;
        touchStartY = event.touches[0].clientY;
      }, { passive: true });
      lightbox.addEventListener("touchend", function (event) {
        if (touchStartX === null) return;
        var touch = event.changedTouches[0];
        var dx = touch.clientX - touchStartX;
        var dy = touch.clientY - touchStartY;
        touchStartX = null;
        touchStartY = null;
        if (Math.abs(dx) < 40 || Math.abs(dx) < Math.abs(dy)) return;
        if (dx < 0) showNextPhoto(); else showPrevPhoto();
      });

      renderFilters();
      renderList();
    })();
  </script>
</div>
