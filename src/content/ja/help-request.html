<div id="page-help-request" class="page-view active help-request-page" data-no-i18n>
  <div class="eyebrow">助け合い掲示板</div>

  <section class="hr-section" id="request-items">
    <div class="hr-section-head">
      <div><h3>助けを探している人</h3></div>
    </div>

    <div class="hr-filters" aria-label="依頼カテゴリー">
      <button type="button" class="hr-filter active" data-filter="all">すべて <small>04</small></button>
      <button type="button" class="hr-filter" data-filter="translate">通訳・翻訳</button>
      <button type="button" class="hr-filter" data-filter="pet">ペット・留守番</button>
      <button type="button" class="hr-filter" data-filter="labor">力仕事・引越し</button>
      <button type="button" class="hr-filter" data-filter="other">その他</button>
    </div>

    <div class="hr-request-grid" id="hrRequestGrid"></div>
  </section>

  <div class="hr-modal" id="hrModal" hidden><div class="hr-modal-backdrop" data-close-modal></div><div class="hr-modal-dialog" role="dialog" aria-modal="true" aria-labelledby="hrModalTitle"><button type="button" class="hr-modal-close" data-close-modal aria-label="閉じる">×</button><span class="hr-card-category" id="hrModalCategory"></span><h3 id="hrModalTitle"></h3><div class="hr-modal-note" id="hrModalNote"></div><dl id="hrModalMeta"></dl></div></div>

  <style>
    .help-request-page{--hr-dark:#203b30;--hr-red:#a8482f;--hr-muted:#756f68}.hr-section-head{margin-bottom:12px}.hr-section-head h3{font-family:"Shippori Mincho",serif;font-size:22px;line-height:1.45;margin:3px 0 0}.hr-filters{display:flex;gap:5px;flex-wrap:wrap;border-bottom:1px solid var(--line);padding-bottom:13px}.hr-filter{border:1px solid var(--line);background:#fff;color:var(--ink-soft);font:600 11px inherit;padding:7px 12px;cursor:pointer}.hr-filter small{font:400 9px "JetBrains Mono",monospace;margin-left:4px}.hr-filter.active,.hr-filter:hover{border-color:var(--hr-dark);background:var(--hr-dark);color:#fff}.hr-request-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;margin-top:17px}.hr-card{border:1px solid var(--line);background:#fff;min-width:0;padding:22px 20px;cursor:pointer;transition:transform .18s ease,box-shadow .18s ease}.hr-card:hover,.hr-card:focus-within{transform:translateY(-2px);box-shadow:0 8px 24px rgba(32,59,48,.1)}.hr-card-top{display:flex;justify-content:flex-end;min-height:18px}.hr-urgent{background:var(--hr-red);color:#fff;font:700 9px "JetBrains Mono",monospace;letter-spacing:.06em;padding:3px 8px;white-space:nowrap}.hr-card h4{margin:0;font-size:17px;line-height:1.6}.hr-modal[hidden]{display:none}.hr-modal{position:fixed;inset:0;z-index:1000;display:grid;place-items:center;padding:20px}.hr-modal-backdrop{position:absolute;inset:0;background:rgba(16,28,24,.55)}.hr-modal-dialog{position:relative;width:min(560px,100%);max-height:min(680px,90vh);overflow:auto;background:#fff;padding:28px;box-shadow:0 18px 50px rgba(0,0,0,.2)}.hr-modal-close{position:absolute;top:10px;right:12px;border:0;background:none;font-size:27px;cursor:pointer;color:var(--ink-soft)}.hr-modal-dialog .hr-card-category{color:var(--hr-red);font:700 9px "JetBrains Mono",monospace;letter-spacing:.1em}.hr-modal-dialog h3{font-family:"Shippori Mincho",serif;font-size:24px;line-height:1.5;margin:9px 30px 14px 0}.hr-modal-note{padding-bottom:18px;border-bottom:1px solid var(--line);font-size:13px;line-height:1.85;color:var(--ink-soft)}.hr-modal-dialog dl{display:grid;grid-template-columns:58px 1fr;gap:10px 14px;margin:18px 0 0;font-size:12px}.hr-modal-dialog dt{color:var(--hr-muted);font-weight:700}.hr-modal-dialog dd{margin:0;line-height:1.6}.hr-contact{color:var(--hr-dark)!important;font-weight:700}@media(max-width:700px){.hr-request-grid{grid-template-columns:1fr}.hr-modal-dialog{padding:24px 20px}}
  </style>

  <script>
    (function () {
      var requests = [
        { category: "translate", categoryLabel: "TRANSLATE", urgent: false, title: "展示会での通訳をお願いしたいです", date: "8月15日（土）10:00〜17:00", area: "東京ビッグサイト", reward: "謝礼 15,000円（応相談）", note: "海外バイヤー向けの展示会で、日⇔英の商談通訳をお願いできる方を探しています。業界知識は不要です。", contact: "LINE: @kojian-sample" },
        { category: "pet", categoryLabel: "PET SITTING", urgent: true, title: "急な帰国のため、猫のお世話をお願いしたいです", date: "8月3日〜8月10日（1週間）", area: "杉並区 高円寺エリア", reward: "謝礼あり（詳細は相談）", note: "家族の急病で帰国することになりました。1日1回、餌やり・トイレ掃除・様子見をお願いできる方を探しています。猫は人懐っこいです。", contact: "LINE: @kojian-sample" },
        { category: "labor", categoryLabel: "MOVING HELP", urgent: false, title: "ソファを1階まで運ぶのを手伝ってほしいです", date: "8月9日（日）午後", area: "足立区 北千住エリア", reward: "謝礼 3,000円＋飲み物", note: "2人掛けソファを3階から1階まで運び出すのを手伝ってくれる方を探しています。所要時間は30分程度の見込みです。", contact: "LINE: @kojian-sample" },
        { category: "other", categoryLabel: "OTHER", urgent: false, title: "役所の書類記入を手伝ってほしいです", date: "都合の良い平日", area: "新宿区役所 付近", reward: "応相談", note: "日本語の書類記入に不安があるため、一緒に区役所へ行って手伝ってくれる方を探しています。", contact: "メール: help.example@mail.com" }
      ];
      var activeFilter = "all";
      function escapeHtml(value) { var el = document.createElement("div"); el.textContent = value; return el.innerHTML; }
      function render() {
        var visible = requests.filter(function (item) { return activeFilter === "all" || item.category === activeFilter; });
        var grid = document.getElementById("hrRequestGrid");
        if (!visible.length) {
          grid.innerHTML = '<div class="hr-empty" style="grid-column:1/-1;padding:30px;text-align:center;color:var(--ink-soft);font-size:13px;">現在、該当する依頼はありません。</div>';
          return;
        }
        grid.innerHTML = visible.map(function (item) {
          return '<article class="hr-card" tabindex="0" role="button" data-request-index="' + requests.indexOf(item) + '"><div class="hr-card-top">' + (item.urgent ? '<span class="hr-urgent">急募</span>' : '') + '</div><h4>' + escapeHtml(item.title) + '</h4></article>';
        }).join("");
        grid.querySelectorAll(".hr-card").forEach(function (card) {
          card.addEventListener("click", function () { openModal(requests[Number(card.dataset.requestIndex)]); });
          card.addEventListener("keydown", function (event) { if (event.key === "Enter" || event.key === " ") { event.preventDefault(); openModal(requests[Number(card.dataset.requestIndex)]); } });
        });
      }
      function openModal(item) {
        document.getElementById("hrModalCategory").textContent = item.categoryLabel;
        document.getElementById("hrModalTitle").textContent = item.title;
        document.getElementById("hrModalNote").textContent = item.note;
        document.getElementById("hrModalMeta").innerHTML = [["日時", item.date], ["場所", item.area], ["謝礼", item.reward], ["連絡先", item.contact]].map(function (entry) { return "<dt>" + escapeHtml(entry[0]) + "</dt><dd" + (entry[0] === "連絡先" ? " class=\"hr-contact\"" : "") + ">" + escapeHtml(entry[1]) + "</dd>"; }).join("");
        document.getElementById("hrModal").hidden = false;
      }
      function closeModal() { document.getElementById("hrModal").hidden = true; }
      document.querySelectorAll(".hr-filter").forEach(function (button) { button.addEventListener("click", function () { activeFilter = button.dataset.filter; document.querySelectorAll(".hr-filter").forEach(function (entry) { entry.classList.toggle("active", entry === button); }); render(); }); });
      document.querySelectorAll("[data-close-modal]").forEach(function (element) { element.addEventListener("click", closeModal); });
      document.addEventListener("keydown", function (event) { if (event.key === "Escape") closeModal(); });
      render();
    })();
  </script>
</div>
