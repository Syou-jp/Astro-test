<div id="page-news" class="page-view active news-page" data-no-i18n>
  <div class="eyebrow">ニュース日報</div>

  <section class="nw-hero">
    <div>
      <p class="nw-lead">毎日、日本で外国人に関連するニュースをまとめてお届けします。</p>
    </div>
  </section>

  <div class="nw-notice"><strong>ご注意</strong><span>本ページの内容は要約・参考情報です。詳細な内容や最新情報は、各ニュースの引用元（一次情報源）をご確認ください。</span></div>

  <section class="nw-section" id="news-list">
    <div class="nw-section-head">
      <div><h3>日報一覧</h3></div>
    </div>

    <div class="nw-issue-grid" id="nwIssueGrid"></div>
  </section>

  <section class="nw-article" id="nwArticle" hidden>
    <button type="button" class="nw-back" id="nwBack">← 日報一覧に戻る</button>
    <article id="nwArticleBody"></article>
    <button type="button" class="nw-back nw-back-bottom" id="nwBackBottom">← 日報一覧に戻る</button>
  </section>

  <div class="nw-note-box">
    本ページのニュース要約は情報提供のみを目的としており、内容の正確性・完全性を保証するものではありません。重要な判断を行う際は、必ず各ニュースの一次情報源（政府機関・報道機関の公式発表など）をご確認ください。
  </div>

  <style>
    .news-page{--nw-dark:#1a3d5c;--nw-sage:#e8f0f7;--nw-cream:#f0f4f8;--nw-accent:#0066cc;--nw-muted:#667080}.news-page>.eyebrow{margin-bottom:8px}.nw-kicker,.nw-section-head span{font:700 10px "JetBrains Mono",monospace;letter-spacing:.12em;color:var(--nw-accent)}.nw-hero{padding:0 0 14px}.nw-hero h2{font-family:"Shippori Mincho",serif;font-size:38px;line-height:1.25;letter-spacing:.05em;margin:7px 0 12px}.nw-lead{max-width:620px;margin:0;font-size:14px;line-height:2;color:var(--ink-soft)}.nw-lead strong{color:var(--nw-accent)}.nw-notice{display:flex;gap:14px;align-items:flex-start;border-left:3px solid var(--nw-accent);border-radius:var(--radius-sm);background:#f0f4f8;padding:12px 14px;font-size:11.5px;line-height:1.75;margin-bottom:31px}.nw-notice strong{color:var(--nw-accent);white-space:nowrap}.nw-notice span{color:var(--ink-soft)}.nw-section{padding-top:2px}.nw-section-head{display:flex;justify-content:space-between;align-items:end;gap:16px;margin-bottom:12px}.nw-section-head h3{font-family:"Shippori Mincho",serif;font-size:22px;line-height:1.45;margin:3px 0 0}

    .nw-issue-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-top:17px}
    .nw-issue{border:1px solid var(--line);border-radius:var(--radius-md);background:#fff;min-width:0;overflow:hidden;display:flex;flex-direction:column;cursor:pointer;text-align:left;padding:0;font:inherit;color:inherit}
    .nw-issue:hover .nw-issue-title{color:var(--nw-accent)}
    .nw-issue-cover{position:relative;aspect-ratio:16/9;overflow:hidden;background:var(--nw-sage)}
    .nw-issue-cover svg,.nw-issue-cover img{width:100%;height:100%;display:block;object-fit:cover}
    .nw-issue-body{padding:10px}
    .nw-issue-date{display:block;font:700 10px "JetBrains Mono",monospace;letter-spacing:.04em;color:var(--nw-accent);margin-bottom:4px}
    .nw-issue-title{display:block;margin:0;font-family:"Shippori Mincho",serif;font-weight:700;font-size:12.5px;line-height:1.55;letter-spacing:.02em}

    .nw-article{padding-top:6px}
    .nw-back{border:1px solid var(--line);border-radius:var(--radius-sm);background:#fff;color:var(--ink-soft);font:600 11px inherit;padding:8px 13px;cursor:pointer;margin-bottom:20px}
    .nw-back:hover{border-color:var(--nw-dark);color:var(--nw-dark)}
    .nw-back-bottom{margin-top:24px;margin-bottom:0}

    .nw-note-box{margin-top:20px;border:1px solid var(--line);border-radius:var(--radius-sm);background:#f7f8fa;padding:12px 14px;font-size:10px;line-height:1.75;color:var(--nw-muted)}
    .nw-art-cover{aspect-ratio:16/6;border-radius:var(--radius-md);overflow:hidden;background:var(--nw-sage);margin-bottom:20px}
    .nw-art-cover svg,.nw-art-cover img{width:100%;height:100%;display:block;object-fit:cover}
    .nw-art-date{font:700 13px "JetBrains Mono",monospace;color:var(--nw-accent)}
    .nw-art-title{font-family:"Shippori Mincho",serif;font-size:26px;line-height:1.5;margin:8px 0 22px}
    .nw-art-section{margin-bottom:26px}
    .nw-art-section h4{font-size:14px;color:var(--nw-accent);border-bottom:2px solid var(--nw-accent);display:inline-block;padding-bottom:3px;margin:0 0 12px}
    .nw-art-section p{font-size:13.5px;line-height:2;color:var(--ink-soft);margin:0 0 12px}
    .nw-art-sources{font-size:10.5px;color:var(--nw-muted);border-top:1px dashed var(--line);padding-top:14px;margin-top:8px}

    @media(max-width:700px){.nw-hero h2{font-size:31px}.nw-issue-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.nw-issue-body{padding:9px}.nw-issue-title{font-size:12.5px}.nw-issue-date{font-size:10px}.nw-section-head{align-items:start;flex-direction:column}.nw-art-title{font-size:21px}}
  </style>

  <script>
    (function () {
      var digestsDataEl = document.getElementById("newsDigestsData");
      var digests = digestsDataEl ? JSON.parse(digestsDataEl.textContent) : [];

      function coverImg(d) {
        return '<img src="' + d.coverImage + '" alt="' + escapeHtml(d.coverAlt) + '" loading="lazy">';
      }

      var listEl = document.getElementById("nwIssueGrid");
      var articleSection = document.getElementById("nwArticle");
      var articleBody = document.getElementById("nwArticleBody");
      var listSection = document.getElementById("news-list");

      function escapeHtml(value) { var el = document.createElement("div"); el.textContent = value; return el.innerHTML; }

      function renderList() {
        listEl.innerHTML = digests.map(function (d) {
          return '<button type="button" class="nw-issue" data-id="' + d.id + '">' +
            '<span class="nw-issue-cover">' + coverImg(d) + '</span>' +
            '<span class="nw-issue-body">' +
              '<span class="nw-issue-date">' + escapeHtml(d.date) + '</span>' +
              '<span class="nw-issue-title">' + escapeHtml(d.title) + '</span>' +
            '</span>' +
          '</button>';
        }).join("");
        listEl.querySelectorAll(".nw-issue").forEach(function (btn) {
          btn.addEventListener("click", function () { openArticle(btn.dataset.id); });
        });
      }

      function openArticle(id) {
        var d = digests.filter(function (item) { return item.id === id; })[0];
        if (!d) return;
        articleBody.innerHTML =
          '<div class="nw-art-cover">' + coverImg(d) + '</div>' +
          '<div class="nw-art-date">' + d.date + '</div>' +
          '<h3 class="nw-art-title">' + escapeHtml(d.title) + '</h3>' +
          d.sections.map(function (s) {
            return '<div class="nw-art-section"><h4>' + escapeHtml(s.h) + '</h4>' + s.p.map(function (para) { return '<p>' + escapeHtml(para) + '</p>'; }).join("") + '</div>';
          }).join("") +
          '<div class="nw-art-sources">出典：' + escapeHtml(d.sources) + '</div>';
        listSection.hidden = true;
        articleSection.hidden = false;
        articleSection.scrollIntoView({ behavior: "smooth", block: "start" });
      }

      function backToList() {
        articleSection.hidden = true;
        listSection.hidden = false;
        listSection.scrollIntoView({ behavior: "smooth", block: "start" });
      }

      document.getElementById("nwBack").addEventListener("click", backToList);
      document.getElementById("nwBackBottom").addEventListener("click", backToList);

      renderList();
    })();
  </script>
</div>
