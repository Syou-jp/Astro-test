      .rl-modal-content{padding:34px 30px 30px;min-width:0;}.rl-modal-content h2{margin:3px 0 18px;padding-right:24px;font-size:clamp(20px,3vw,30px);}
    .rl-detail-grid{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px;}.rl-detail-item{margin:0;padding:10px 8px;border:1px solid var(--line,#ddd6c5);background:#fff;border-radius:10px;min-width:0;}.rl-detail-item:nth-child(-n+4){grid-column:span 4;}.rl-detail-item:nth-child(n+5){grid-column:span 2;}.rl-detail-item.rl-detail-wide{grid-column:span 6;}.rl-detail-item.rl-detail-triple{grid-column:span 2;}.rl-detail-item.rl-detail-pair{grid-column:span 3;}.rl-detail-grid .rl-detail-item.rl-detail-triple,.rl-detail-grid .rl-detail-item.rl-detail-pair{grid-row:auto;}.rl-detail-item dt{font-size:10px;color:var(--ink-soft,#6b665a);font-weight:700;}.rl-detail-item dd{margin:4px 0 0;font-size:12px;line-height:1.45;overflow-wrap:anywhere;}.rl-thumbs{display:grid;grid-template-columns:repeat(9,1fr);gap:7px;margin:12px 0 0;}.rl-thumb{padding:0;border:2px solid transparent;background:none;aspect-ratio:1;overflow:hidden;cursor:pointer;border-radius:6px;}.rl-thumb.active{border-color:var(--accent);}.rl-thumb img{width:100%;height:100%;object-fit:cover;display:block;}
      .rl-modal-open{overflow:hidden;}
      @media(max-width:640px){

        .rl-meta{font-size:13px;}
        .rl-price{font-size:16px;}
        .rl-desc{font-size:13.5px;}
        .rl-footer{font-size:12.5px;}
        .rl-contact{font-size:13px;}
        .rl-feature-filters{grid-template-columns:repeat(2,minmax(0,1fr));}.rl-feature-filter{font-size:11.5px;}.rl-list-controls{grid-template-columns:1fr;}.rl-modal{padding:0;}.rl-modal-panel{display:block;width:100%;max-height:100vh;border-radius:0;}.rl-modal-media{padding:0;}.rl-modal-gallery{min-height:280px;height:42vh;}#rlModalImage{height:calc(42vh - 20px)!important;max-width:calc(100% - 20px)!important;}.rl-gallery-arrow{width:38px;height:38px;font-size:31px;}.rl-gallery-arrow.prev{left:10px;}.rl-gallery-arrow.next{right:10px;}.rl-modal-content{padding:18px 16px 20px;}.rl-detail-grid{grid-template-columns:1fr;gap:8px;}.rl-detail-item:nth-child(-n+4),.rl-detail-item:nth-child(n+5),.rl-detail-item.rl-detail-wide,.rl-detail-grid .rl-detail-item.rl-detail-triple,.rl-detail-grid .rl-detail-item.rl-detail-pair{grid-column:auto;}.rl-thumbs{grid-template-columns:repeat(5,1fr);gap:5px;margin:8px 16px 0;}
      }
    </style>

    <script>
    (function(){
      // ▼▼▼ 物件データ：物件を追加・削除する場合は、この配列を直接編集してください ▼▼▼
      // type: "share"＝ルームシェア募集（同居人を探す・空き部屋をシェア） / "tenant"＝入居者募集（大家さんが一戸まるごと募集）
      // origin：投稿者または現在の入居者の出身地表示（日本国籍かどうかを問わない）。例：台湾人、香港人、日本人、中国人、韓国人 など
      var RL_LISTINGS = [
        {
          type: "tenant",
          region: "東京都",
          image: "",
          title: "足立区 千住 1LDK",
          address: "東京都足立区（北千住駅から徒歩8分）",
          price: "家賃 90,000円（管理費 5,000円込み）",
          origin: "大家さん：台湾人",
          desc: "1LDK、北千住駅から徒歩8分。猫の飼育可、外国人の申込可。保証人または保証会社が必要です。",
          features: ["pet", "nationality", "contract", "furnished"],
          minMonths: 6,
          sample: true,
          contact: "LINE：@kojian-sample",
          updated: "2026/08/07 07:29",
          photos: [
            "/images/listings/senju-1ldk/living-room.png",
            "/images/listings/senju-1ldk/entrance.png",
            "/images/listings/senju-1ldk/bathroom.png",
            "/images/listings/senju-1ldk/toilet.png",
            "/images/listings/senju-1ldk/balcony.png",
            "/images/listings/senju-1ldk/exterior.png",
            "/images/listings/senju-1ldk/building-entrance.png",
            "/images/listings/senju-1ldk/mailboxes.png"
          ],
          details: [
            ["物件住所", "東京都足立区千住（北千住駅から徒歩8分）"],
            ["家賃", "90,000円／月（管理費 5,000円込み）"],
            ["初期費用", "敷金1か月・礼金1か月・清掃費 55,000円（退居時）"],
            ["物件紹介", "家具・家電付き。エレベーター付きのマンションで、駅から徒歩8分。共用部も管理されています。"],
            ["条件", "保証人または保証会社が必要です。"],
            ["間取り", "1LDK・約40㎡"],
            ["契約期間", "半年以上"],
            ["国籍", "不限"],
            ["ペット", "猫1匹まで相談可"]
          ]
        },
        {
          type: "share",
          region: "東京都",
          image: "",
          title: "台東区 上野 1室",
          address: "東京都台東区（上野駅から徒歩8分）",
          price: "家賃 58,000円",
          origin: "現在の入居者：静かな会社員",
          desc: "家具・家電付きの個室です。現在の同居人は静かな会社員で、共用スペースもきれいに使っています。落ち着いて暮らせる方を募集しています。",
          features: ["pet", "nationality", "contract", "furnished"],
          minMonths: 6,
          sample: true,
          contact: "LINE：@kojian-sample",
          updated: "2026/08/07 07:29",
          photos: [
            "/images/listings/roomshare-katsushika/living-room.png",
            "/images/listings/roomshare-katsushika/kitchen-dining.png",
            "/images/listings/roomshare-katsushika/bedroom.png",
            "/images/listings/roomshare-katsushika/entrance.png",
            "/images/listings/roomshare-katsushika/bathroom-laundry.png",
            "/images/listings/roomshare-katsushika/balcony.png"
          ],
          details: [
            ["物件住所", "東京都台東区（上野駅から徒歩8分）"],
            ["家賃", "58,000円／月（毎月光熱費等割り勘）"],
            ["初期費用", "敷金 1か月分・礼金なし・初月家賃・清掃費 30,000円（退居時）"],
            ["物件紹介", "家具・家電付きの個室です。現在の室友は静かな会社員で、共用スペースもきれいに使っています。"],
            ["条件", "3室ある物件で、現在空いているのは1室です。トイレ・浴室は1か所のみ。掃除は住人で順番に行います。ペットを怖がらない方・大きな音を出さない方・きれい好きな方"],
            ["間取り", "2LDK・個室1室"],
            ["契約期間", "半年以上"],
            ["国籍", "不限"],
            ["ペット", "相談可"]
          ]
        }
      ];
      // ▲▲▲ 物件データここまで ▲▲▲

      var currentFilter = "all";
      var currentFeatures = [];
      var currentContractMonths = 0;
      var currentSort = "newest";
      var currentRegion = "all";
      var currentPage = 1;
      var pageSize = 8;

      // Keep the two built-in examples aligned with submitted listing details.
      RL_LISTINGS.filter(function(item){ return item.sample; }).forEach(function(item, index){
        item.details = [
          ["物件所在地", item.address || "TEST", "wide"],
          ["家賃", item.price || "TEST", "wide"],
          ["間取り・広さ", index === 0 ? "1LDK／40㎡" : "2LDK／TEST", "triple"],
          ["家具・家電", "TEST", "triple"],
          ["入居可能時期", "TEST", "triple"],
          ["物件紹介", item.desc || "TEST", "wide"],
          ["条件", "TEST", "wide"],
          ["国籍", "TEST", "pair"],
          ["ペット", "TEST", "pair"],
          ["投稿者", "TEST", "pair"],
          ["連絡方法", item.contact || "TEST", "pair"]
        ];
      });

      function esc(s){
        var d = document.createElement("div");
        d.textContent = s || "";
        return d.innerHTML;
      }

      function badgeLabel(type){ return type === "share" ? "ルームシェア募集" : "オーナー直貸し"; }

      function renderPagination(totalPages){
        var pagination = document.getElementById("rlPagination");
        if (totalPages <= 1) { pagination.innerHTML = ""; return; }
        var html = '<button type="button" class="rl-page-button" data-rl-page="' + (currentPage - 1) + '"' + (currentPage === 1 ? ' disabled' : '') + '>前へ</button>';
        for (var i = 1; i <= totalPages; i++) html += '<button type="button" class="rl-page-button' + (i === currentPage ? ' active' : '') + '" data-rl-page="' + i + '">' + i + '</button>';
        html += '<button type="button" class="rl-page-button" data-rl-page="' + (currentPage + 1) + '"' + (currentPage === totalPages ? ' disabled' : '') + '>次へ</button>';
        pagination.innerHTML = html;
      }

      function render(){
        tabs.forEach(function(pair){
          var tab = document.getElementById(pair[0]);
          if (tab) tab.classList.toggle("active", currentFilter === pair[1]);
        });
        var list = RL_LISTINGS.filter(function(item){
          var featureMatch = currentFeatures.every(function(feature){ return (item.features || []).indexOf(feature) !== -1; });
          var contractMatch = !currentContractMonths || (item.minMonths || 0) <= currentContractMonths;
          var regionMatch = currentRegion === "all" || item.region === currentRegion;
          return (currentFilter === "all" || item.type === currentFilter) && featureMatch && contractMatch && regionMatch;
        });
        list.sort(function(a, b){ return currentSort === "newest" ? b.updated.localeCompare(a.updated) : a.updated.localeCompare(b.updated); });
        var totalPages = Math.max(1, Math.ceil(list.length / pageSize));
        if (currentPage > totalPages) currentPage = totalPages;
        var pageItems = list.slice((currentPage - 1) * pageSize, currentPage * pageSize);
        document.getElementById("rlResultCount").textContent = "全 " + list.length + " 件" + (totalPages > 1 ? "（" + currentPage + " / " + totalPages + "ページ）" : "");

        var grid = document.getElementById("rlGrid");
        if (!list.length){
          grid.innerHTML = '<div class="rl-empty">このカテゴリにはまだ物件がありません。掲載をご希望の方はお気軽にご連絡ください。</div>';
          renderPagination(1);
          return;
        }

        grid.innerHTML = pageItems.map(function(item){
          var imageSrc = item.image || (item.photos && item.photos[0]);
          var imageHtml = imageSrc
            ? '<img src="' + esc(imageSrc) + '" alt="' + esc(item.title) + '" loading="lazy" onerror="this.parentElement.innerHTML=\'<span>写真準備中</span>\'">'
            : '<span>写真準備中</span>';
          return '' +
            '<div class="rl-card' + (item.photos ? ' rl-card-link' : '') + '"' + (item.photos ? ' data-rl-open="' + RL_LISTINGS.indexOf(item) + '" tabindex="0" role="button" aria-label="' + esc(item.title) + 'の詳細を見る"' : '') + '>' +
              '<div class="rl-card-image">' + imageHtml +
                '<span class="rl-badge ' + item.type + '">' + badgeLabel(item.type) + '</span>' +
                (item.sample ? '<span class="rl-sample-badge">例示・実在しない物件</span>' : '') +
              '</div>' +
              '<div class="rl-body">' +
                '<h3>' + esc(item.title) + '</h3>' +
                '<div class="rl-meta">' +
                  '<span>📍 ' + esc(item.address) + '</span>' +
                '</div>' +
                '<div class="rl-price">' + esc(item.price) + '</div>' +
                '<div class="rl-footer">' +
                  '<span>更新：' + esc(item.updated) + '</span>' +
                  (item.avatar ? '<span class="rl-author"><img class="rl-author-avatar" src="' + esc(item.avatar) + '" alt=""><span>' + esc(item.origin) + '</span><span class="rl-author-flag">' + esc(item.flag) + '</span></span>' : '') +
                '</div>' +
              '</div>' +
            '</div>';
        }).join("");
        renderPagination(totalPages);
      }

      var tabs = [
        ["rlTabShare", "share"],
        ["rlTabTenant", "tenant"]
      ];
      tabs.forEach(function(pair){
        var el = document.getElementById(pair[0]);
        if (!el) return;
        el.addEventListener("click", function(){
          var wasActive = el.classList.contains("active");
          currentFilter = wasActive ? "all" : pair[1];
          currentPage = 1;
          tabs.forEach(function(p){ document.getElementById(p[0]).classList.remove("active"); });
          if (!wasActive) el.classList.add("active");
          render();
          if (currentFilter === "all") window.setTimeout(function(){ tabs.forEach(function(p){ document.getElementById(p[0]).classList.remove("active"); }); }, 0);
        });
      });

      document.querySelectorAll("[data-rl-feature]").forEach(function(el){
        el.addEventListener("click", function(){
          var feature = el.getAttribute("data-rl-feature");
          var featureIndex = currentFeatures.indexOf(feature);
          if (featureIndex === -1) currentFeatures.push(feature);
          else currentFeatures.splice(featureIndex, 1);
          el.classList.toggle("active", currentFeatures.indexOf(feature) !== -1);
          currentPage = 1;
          render();
        });
      });
      document.getElementById("rlContractFilter").addEventListener("change", function(){
        currentContractMonths = Number(this.value) || 0;
        currentPage = 1;
        this.classList.toggle("active", currentContractMonths > 0);
        render();
      });
      document.getElementById("rlSortFilter").addEventListener("change", function(){
        currentSort = this.value;
        currentPage = 1;
        render();
      });
      document.getElementById("rlRegionFilter").addEventListener("change", function(){
        currentRegion = this.value;
        currentPage = 1;
        render();
      });
      document.addEventListener("click", function(event){
        var pageButton = event.target.closest("[data-rl-page]");
        if (!pageButton || pageButton.disabled) return;
        currentPage = Number(pageButton.getAttribute("data-rl-page"));
        render();
      });

      render();

      function rlSubmissionPhotoUrl(key){
        return "https://sotocom-api.syouboc.workers.dev/api/photos?key=" + encodeURIComponent(key);
      }

      function rlCountryFlag(code){
        return /^[A-Z]{2}$/.test(code || "") ? code.replace(/./g, function(char){ return String.fromCodePoint(127397 + char.charCodeAt(0)); }) : "";
      }

      function rlSubmissionToListing(submission){
        var payload = submission.payload || {};
        var photos = (payload.photoKeys || []).map(rlSubmissionPhotoUrl);
        var rent = Number(payload.rent || 0).toLocaleString("ja-JP");
        var fee = Number(payload.managementFee || 0).toLocaleString("ja-JP");
        var location = [payload.prefecture, payload.area, payload.station].filter(Boolean).join("・");
        var price = "家賃 " + rent + "円" + (Number(payload.managementFee || 0) ? "／管理費 " + fee + "円" : "");
        var furnished = payload.furnished === "あり" ? "家具・家電付き" : payload.furnished === "一部" ? "一部あり" : "なし";
        var moveInLabels = { immediate: "即入居可", "next-month": "来月から", date: "日付を相談", other: "その他" };
        return {
          type: payload.listingType === "share" ? "share" : "tenant",
          region: payload.prefecture || "その他",
          image: photos[0] || "",
          title: payload.title || "入居募集",
          address: location,
          price: price,
          origin: submission.display_name || "投稿者",
          avatar: submission.avatar_url || "",
          flag: rlCountryFlag(submission.author_nationality_code),
          desc: payload.details || "",
          features: payload.furnished && payload.furnished !== "なし" ? ["furnished"] : [],
          minMonths: 0,
          sample: false,
          contact: "",
          updated: String(submission.created_at || "").replace(/-/g, "/").slice(0, 16),
          photos: photos,
          details: [
            ["物件所在地", location || "未入力", "wide"],
            ["家賃", price, "wide"],
            ["間取り・広さ", [payload.layout, payload.floorArea].filter(Boolean).join("／") || "未入力", "triple"],
            ["家具・家電", furnished, "triple"],
            ["入居可能時期", moveInLabels[payload.moveIn] || payload.moveIn || "未入力", "triple"],
            ["物件紹介", payload.title || "未入力", "wide"],
            ["条件", payload.details || "未入力", "wide"],
            ["国籍", submission.author_nationality_label || payload.nationality || "未設定", "pair"],
            ["ペット", payload.pet || "未入力", "pair"],
            ["投稿者", [submission.display_name || "未入力", rlCountryFlag(submission.author_nationality_code), "（国籍：" + (submission.author_nationality_label || "未設定") + "）"].filter(Boolean).join(" "), "pair"],
            ["連絡方法", payload.contact || "未入力", "pair"]
          ]
        };
      }

      fetch("https://sotocom-api.syouboc.workers.dev/api/submissions?type=listings&_=" + Date.now())
        .then(function(response){ if (!response.ok) throw new Error("submission-fetch-failed"); return response.json(); })
        .then(function(data){
          var published = (data.submissions || []).map(rlSubmissionToListing);
          if (!published.length) return;
          RL_LISTINGS.unshift.apply(RL_LISTINGS, published);
          currentPage = 1;
          render();
        })
        .catch(function(error){ console.warn("Sotocom listings could not be loaded", error); });

      var modal = document.getElementById("rlModal");
      var modalImage = document.getElementById("rlModalImage");
      var modalBadge = document.getElementById("rlModalBadge");
      var modalTitle = document.getElementById("rlModalTitle");
      var modalDetails = document.getElementById("rlModalDetails");
      var modalThumbs = document.getElementById("rlModalThumbs");
      var galleryCount = document.getElementById("rlGalleryCount");
      var currentPhotos = [];
      var currentPhotoIndex = 0;

      function showPhoto(index){
        currentPhotoIndex = (index + currentPhotos.length) % currentPhotos.length;
        modalImage.src = currentPhotos[currentPhotoIndex];
        modalImage.alt = modalTitle.textContent + " 写真" + (currentPhotoIndex + 1);
        galleryCount.textContent = (currentPhotoIndex + 1) + " / " + currentPhotos.length;
        fitModalImage();
        window.setTimeout(fitModalImage, 0);
        Array.prototype.forEach.call(modalThumbs.children, function(thumb, i){ thumb.classList.toggle("active", i === currentPhotoIndex); });
      }

      function fitModalImage(){
        var gallery = modalImage.parentElement;
        if (!gallery || !modalImage.naturalWidth) return;
        var availableHeight = Math.max(1, gallery.clientHeight - 32);
        var availableWidth = Math.max(1, gallery.clientWidth - 32);
        var ratio = modalImage.naturalWidth / modalImage.naturalHeight;
        var width = Math.min(availableWidth, availableHeight * ratio);
        var height = width / ratio;
        if (height > availableHeight) { height = availableHeight; width = height * ratio; }
        modalImage.style.width = Math.round(width) + "px";
        modalImage.style.height = Math.round(height) + "px";
        modalImage.style.maxWidth = "none";
        modalImage.style.maxHeight = "none";
      }

      function openModal(index){
        var item = RL_LISTINGS[index];
        if (!item || !item.photos) return;
        currentPhotos = item.photos;
        modalBadge.textContent = badgeLabel(item.type) + (item.sample ? "・例示（実在しない物件）" : "");
        modalTitle.textContent = item.title;
        modalDetails.innerHTML = item.details.map(function(detail, detailIndex){ var detailClass = detail[2] || (item.sample ? (detailIndex < 4 ? 'wide' : 'pair') : 'wide'); return '<div class="rl-detail-item rl-detail-' + detailClass + '"><dt>' + esc(detail[0]) + '</dt><dd>' + esc(detail[1]) + '</dd></div>'; }).join("");
        modalThumbs.innerHTML = item.photos.map(function(photo, i){ return '<button type="button" class="rl-thumb" data-rl-photo="' + i + '"><img src="' + photo + '" alt="写真' + (i + 1) + '"></button>'; }).join("");
        modal.hidden = false;
        modal.setAttribute("aria-hidden", "false");
        document.body.classList.add("rl-modal-open");
        showPhoto(0);
      }

      document.addEventListener("click", function(event){
        var open = event.target.closest("[data-rl-open]");
        var close = event.target.closest("[data-rl-close]");
        var thumb = event.target.closest("[data-rl-photo]");
        if (open) openModal(Number(open.getAttribute("data-rl-open")));
        if (close) { modal.hidden = true; modal.setAttribute("aria-hidden", "true"); document.body.classList.remove("rl-modal-open"); }
        if (thumb) showPhoto(Number(thumb.getAttribute("data-rl-photo")));
      });
      document.addEventListener("keydown", function(event){
        var card = event.target.closest(".rl-card-link[data-rl-open]");
        if (card && (event.key === "Enter" || event.key === " ")) { event.preventDefault(); openModal(Number(card.getAttribute("data-rl-open"))); }
      });
      document.querySelector("[data-rl-prev]").addEventListener("click", function(){ showPhoto(currentPhotoIndex - 1); });
      document.querySelector("[data-rl-next]").addEventListener("click", function(){ showPhoto(currentPhotoIndex + 1); });
      modalImage.onload = fitModalImage;
      modalImage.addEventListener("load", fitModalImage);
      window.addEventListener("resize", fitModalImage);
      document.addEventListener("keydown", function(event){
        if (modal.hidden) return;
        if (event.key === "Escape") document.querySelector("[data-rl-close]").click();
        if (event.key === "ArrowLeft") showPhoto(currentPhotoIndex - 1);
        if (event.key === "ArrowRight") showPhoto(currentPhotoIndex + 1);
      });
    })();
    </script>
  </div><!-- /page-listings -->
