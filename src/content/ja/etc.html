function etcRoundTen(value){ return Math.round(value/10)*10; }
function etcFindStation(name){ return ETC_ALL_IC.find(station => station.name === name); }
function etcEstimateDistance(from,to){
 const a = etcFindStation(from), b = etcFindStation(to);
 if (!a || !b) return 0;
 const rad = Math.PI / 180;
 const lat1 = a.lat * rad, lat2 = b.lat * rad;
 const dLat = (b.lat - a.lat) * rad, dLng = (b.lng - a.lng) * rad;
 const h = Math.sin(dLat / 2) ** 2 + Math.cos(lat1) * Math.cos(lat2) * Math.sin(dLng / 2) ** 2;
 return Math.max(1, Math.round(6371 * 2 * Math.atan2(Math.sqrt(h),Math.sqrt(1 - h)) * 1.28 * 10) / 10);
}

function etcInitRouteSelects(){
 const from = document.getElementById("etcFrom");
 const to = document.getElementById("etcTo");
 if (!from || !to) return;
 const routes = ETC_ROUTE_DATA;
 const stations = ETC_ALL_IC.slice().sort((a,b) => a.name.localeCompare(b.name,"ja"));
 const stationOption = station => `<option value="${station.name}">${station.name}</option>`;
 from.innerHTML = '<option value="">出発地を選択</option>' + stations.map(stationOption).join("");
 from.addEventListener("change",() => {
  const destinations = stations.filter(station => station.name !== from.value);
  to.disabled = !from.value;
  to.innerHTML = (from.value ? '<option value="">到着地を選択</option>' : '<option value="">先に出発地を選択</option>')
   + destinations.map(station => {
    const route = routes.find(item => item.from === from.value && item.to === station.name);
    return `<option value="${station.name}">${station.name}${route ? `（${route.km}km）` : "（概算）"}</option>`;
   }).join("");
  document.getElementById("etcRouteStatus").textContent = "到着地を選択してください。登録済み区間は公式データ、それ以外は概算で表示します。";
  etcUpdateSelectedIcButtons();
 });
 to.addEventListener("change",() => {
  etcRender();
  etcUpdateSelectedIcButtons();
 });
}

  const name = button.dataset.icName, from = document.getElementById("etcFrom"), to = document.getElementById("etcTo"), region = document.getElementById("etcRegion");
  if ((target === "from" && name === to.value) || (target === "to" && name === from.value)) {
   document.getElementById("etcRouteStatus").textContent = "出発ICと到着ICは同じICを選択できません。";
   return;
  }
  region.value = "all";
  if (target === "from") {
   from.value = name;
   to.value = "";
   to.disabled = true;
   setTarget("to");
  } else {
  if (![...to.options].some(option => option.value === name)) {
   to.add(new Option(name, name));
  }
   to.value = name;
   to.disabled = false;
   document.getElementById("etcRouteStatus")?.scrollIntoView({block:"center",behavior:"smooth"});
 }
  etcRender();
  etcUpdateSelectedIcButtons();
  updateResultStates();
  search.value = "";
  renderResults();
 };
 modal._renderResults = renderResults;
 const chooseModalRegion = value => { selectedRegion = value; renderResults(); };
 map.querySelectorAll(".etc-map-region").forEach(mapRegion => {
  mapRegion.style.cursor = "pointer";
  mapRegion.style.padding = "7px 12px";
  mapRegion.style.background = "#fff";
  mapRegion.style.border = "2px solid #159bd3";
  mapRegion.style.borderRadius = "4px";
  mapRegion.style.color = "#1f2937";
  mapRegion.style.fontWeight = "700";
  mapRegion.addEventListener("click", () => chooseModalRegion(mapRegion.dataset.region));
  mapRegion.addEventListener("keydown", event => { if (event.key === "Enter" || event.key === " ") { event.preventDefault(); chooseModalRegion(mapRegion.dataset.region); } });
 });
 map.querySelectorAll(".etc-city").forEach(city => city.addEventListener("click", () => { selectedRegion = "all"; search.value = city.dataset.query; renderResults(); }));
  const setTarget = value => {
   target = value;
   document.getElementById("etcIcModalTitle").textContent = target === "from" ? "地図から出発ICを選択" : "地図から到着ICを選択";
   document.querySelectorAll(".etc-modal-target").forEach(item => {
   const active = item.dataset.target === target;
   item.style.background = active ? "#eff6ff" : "#fff";
    item.style.borderColor = active ? "#1d4ed8" : "#cbd5e1";
    item.style.boxShadow = active ? "0 0 0 2px #dbeafe" : "none";
   });
  };
  document.querySelectorAll(".etc-modal-target").forEach(button => button.addEventListener("click", () => setTarget(button.dataset.target)));
 const setMode = mode => {
  map.style.display = mode === "map" ? "block" : "none";
  document.querySelectorAll(".etc-map-mode").forEach(button => { const active = button.dataset.mode === mode; button.style.borderBottomColor = active ? "#1d4ed8" : "transparent"; button.style.color = active ? "#183b7a" : "#64748b"; });
 };
 document.querySelectorAll(".etc-map-mode").forEach(button => button.addEventListener("click", () => setMode(button.dataset.mode)));
 search.addEventListener("input", renderResults);
 open.addEventListener("click", () => { modal.hidden = false; renderResults(); search.focus(); });
 close.addEventListener("click", () => { modal.hidden = true; });
 modal.addEventListener("click", event => { if (event.target === modal) modal.hidden = true; });
 setMode("map");
 renderResults();
}
async function etcLoadAllIC(){
 try {
  const response = await fetch(new URL("/data/etc-icdata.json", document.baseURI));
  if (!response.ok) throw new Error(`IC data ${response.status}`);
  const stations = await response.json();
  if (!Array.isArray(stations) || stations.length < 1000) throw new Error("IC data is incomplete");
  ETC_ALL_IC.length = 0;
  ETC_ALL_IC.push(...stations);
  etcInitRouteSelectsV2();
  etcInitMapModal();
  etcRender();
 } catch (error) {
  console.warn("全国ICデータを読み込めませんでした。", error);
 }
}
function etcRender(){
 if (!document.querySelector("#etcFrom")) return;
 const fromName = document.getElementById("etcFrom").value;
 const toName = document.getElementById("etcTo").value;
 const officialRoute = ETC_ROUTE_DATA.find(item => item.from === fromName && item.to === toName && item.normal > 0);
 const vehicleKey = document.getElementById("etcVehicle").value;
 const vehicle = ETC_VEHICLE[vehicleKey] || ETC_VEHICLE.normal;
 const distance = officialRoute?.km || etcEstimateDistance(fromName,toName);
 if (!fromName || !toName || !distance){
  ["etcTotal","etcBefore","etcPerKm"].forEach(id => document.getElementById(id).textContent = "—");
  document.getElementById("etcRouteStatus").textContent = fromName && !toName
   ? `出発IC：${fromName}（到着ICを選択してください）`
   : !fromName && toName
    ? `到着IC：${toName}（先に出発ICを選択してください）`
    : "起点と終点を選択してください。";
  document.getElementById("etcBreakdown").innerHTML = "";
  return;
 }
 const discount = document.getElementById("etcDiscount").value;
 const normalToll = officialRoute?.normal || etcRoundTen(150 + 24.6 * distance);
 const baseToll = vehicleKey === "normal" ? normalToll : etcRoundTen(normalToll * vehicle.factor);
 let finalToll = baseToll, discountAmount = 0;
 if (discount === "night"){
  finalToll = etcRoundTen(baseToll * 0.7);
  discountAmount = baseToll - finalToll;
 } else if (discount === "holiday"){
  const cappedKm = Math.min(distance,100);
  const cappedToll = etcRoundTen(baseToll * cappedKm / distance);
  const cappedDiscounted = etcRoundTen(cappedToll * 0.8);
  const remainderToll = distance > 100 ? etcRoundTen(vehicle.perKm * (distance - 100)) : 0;
  finalToll = cappedDiscounted + remainderToll;
  discountAmount = baseToll - finalToll;
 }
 document.getElementById("etcTotal").textContent = portalYen(finalToll);
 document.getElementById("etcBefore").textContent = portalYen(baseToll);
 document.getElementById("etcPerKm").textContent = `${vehicle.label}・${distance}km`;
 document.getElementById("etcRouteStatus").textContent = officialRoute ? `${fromName} → ${toName}・公式データ距離 ${distance}km` : `${fromName} → ${toName}・距離と料金の概算`;
 const noteCopy = ETC_NOTE_TEXT[typeof siteCurrentLanguage !== "undefined" ? siteCurrentLanguage : "ja"] || ETC_NOTE_TEXT.ja;
 document.getElementById("etcNote").textContent = noteCopy[discount] || noteCopy.none;
 document.getElementById("etcMileageNote").textContent = "出典：NEXCO公式IC資料をもとにした全国IC選択。登録済み区間はNEXCO ドラぷらの普通車ETC料金・距離、それ以外はIC間距離からの概算です。";
 portalRows("etcBreakdown",[
  ["通常料金（概算）",portalYen(baseToll)],
  ["適用した割引額",discount==="none" ? "—" : `-${portalYen(discountAmount)}`],
  ["割引後の概算料金",portalYen(finalToll)]
 ]);
}
if (document.querySelector("#etcFrom")){
 ["etcVehicle","etcDiscount"].forEach(id=>document.getElementById(id).addEventListener("input",etcRender));
 document.getElementById("etcCalcBtn").addEventListener("click",etcRender);
 etcInitRouteSelectsV2();
 etcInitMapModal();
 etcRender();
 etcLoadAllIC();
}
</script>
