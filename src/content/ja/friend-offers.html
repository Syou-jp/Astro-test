let friendToastTimer;
function friendOfferPlaceholder(label){return `<div class="friend-offer-image"><span>${jobEscape(label)}</span></div>`;}
function friendOfferValue(value,lang){return value&&typeof value==="object"?(value[lang]||value.ja||""):String(value||"");}
function friendOfferRender(lang){
 const c=FRIEND_OFFER_COPY[lang]||FRIEND_OFFER_COPY.ja,offers=FRIEND_OFFERS.filter(x=>x.active!==false).slice(0,10),latest=offers.map(x=>x.updated||"").sort().reverse()[0]||"";
 document.getElementById("friendOffersEyebrow").textContent=c.eyebrow;document.getElementById("friendOffersIntro").innerHTML=c.intro;document.getElementById("friendOffersTitle").textContent=c.title;document.getElementById("friendOffersCount").textContent=c.count(offers.length);document.getElementById("friendOffersUpdated").textContent=c.latest(latest);document.getElementById("friendOffersNotice").innerHTML=c.notice;
 document.getElementById("friendOfferGrid").innerHTML=offers.length?offers.map((offer,index)=>{const title=friendOfferValue(offer.title,lang),category=friendOfferValue(offer.category,lang),description=friendOfferValue(offer.description,lang),actions=(offer.actions||[]).map(action=>`<a class="friend-action-link" href="${jobEscape(action.url)}" target="_blank" rel="noopener sponsored"><span>${jobEscape(friendOfferValue(action.label,lang))}<br><small>${jobEscape(friendOfferValue(action.note,lang))}</small></span><b>→</b></a>`).join("");return `<article class="friend-offer-card">${offer.image?`<div class="friend-offer-image ${offer.imageFit==="contain"?"contain":""}"><img src="${jobEscape(offer.image)}" alt="${jobEscape(title||c.image)}" loading="lazy" onerror="this.parentElement.innerHTML='<span>${jobEscape(c.image)}</span>'"><span class="friend-pr">${jobEscape(c.pr)}</span></div>`:friendOfferPlaceholder(c.image)}<div class="friend-offer-body"><span class="friend-offer-category">${jobEscape(category||c.pr)}</span><h3>${jobEscape(title)}</h3><p>${jobEscape(description)}</p>${actions?`<div class="friend-action-list">${actions}</div>`:""}${offer.code?`<div class="friend-code-box"><code>${jobEscape(offer.code)}</code><button type="button" class="friend-code-copy" data-code="${jobEscape(offer.code)}">${jobEscape(c.copy)}</button></div>`:""}<div class="friend-offer-footer"><span>${jobEscape(c.updated)}：${jobEscape(offer.updated||"—")}</span>${offer.url?`<a class="friend-offer-link" href="${jobEscape(offer.url)}" target="_blank" rel="noopener sponsored">${jobEscape(c.open)} →</a>`:""}</div></div></article>`;}).join(""):`<div class="friend-offer-empty">${jobEscape(c.empty)}</div>`;
}
document.getElementById("friendOfferGrid").addEventListener("click",async event=>{const btn=event.target.closest(".friend-code-copy");if(!btn)return;try{await navigator.clipboard.writeText(btn.dataset.code);}catch(e){const area=document.createElement("textarea");area.value=btn.dataset.code;document.body.appendChild(area);area.select();document.execCommand("copy");area.remove();}const lang=typeof siteCurrentLanguage!=="undefined"?siteCurrentLanguage:"ja",toast=document.getElementById("friendOfferToast");toast.textContent=(FRIEND_OFFER_COPY[lang]||FRIEND_OFFER_COPY.ja).copied;toast.classList.add("show");clearTimeout(friendToastTimer);friendToastTimer=setTimeout(()=>toast.classList.remove("show"),1800);});
friendOfferRender("ja");
</script>
