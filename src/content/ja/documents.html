<div id="page-documents" class="page-view active theme-apply">
    <div class="eyebrow" id="docBuilderEyebrow">書類作成</div>

    <section id="doc-type-business" class="doc-type-panel active theme-apply">
          <div class="portal-alert"><strong>入力しながら右側で完成形を確認：</strong>金額書類は明細・消費税を自動計算し、契約・社内文書は本文を自由に編集できます。PDF、Word、Excel、画像で保存できます。</div>
          <div class="business-workspace">
            <div class="card" id="businessFormCard">
              <div class="apply-fields">
                <div class="apply-field full"><label>書類の種類</label><select id="businessDocType"><optgroup label="財務・取引"><option value="invoice">請求書</option><option value="receipt">領収書</option><option value="delivery">納品書</option><option value="order">注文書</option><option value="purchase">発注書</option><option value="payment">支払明細書</option></optgroup><optgroup label="契約・社内管理"><option value="contract">業務委託契約書</option><option value="memorandum">覚書</option><option value="nda">秘密保持契約書（NDA）</option><option value="ringi">稟議書</option><option value="proposal">企画書</option><option value="suggestion">提案書</option><option value="incident">顛末書</option><option value="apology">始末書</option></optgroup><optgroup label="仲介用"><option value="viewing-request">内見申込書</option><option value="move-in-application">入居申込書</option><option value="purchase-offer">買付証明書</option></optgroup></select></div>
                <div class="apply-field"><label>発行日 Issue date</label><input type="date" id="businessDate"></div>
                <div class="apply-field"><label>書類番号 Document no.</label><input id="businessNo" placeholder="INV-2026-001"></div>
                <div class="apply-field full"><label>件名 Subject</label><input id="businessSubject" placeholder="業務委託料のご請求"></div>
                <div class="apply-field"><label>宛先 Recipient</label><input id="businessRecipient" placeholder="株式会社○○ 御中"></div>
                <div class="apply-field"><label>発行者 Issuer</label><input id="businessIssuer" placeholder="株式会社△△"></div>
                <div class="apply-field full"><label>発行者住所</label><input id="businessIssuerAddress" placeholder="〒000-0000 東京都…"></div>
                <div class="apply-field"><label>電話番号</label><input id="businessIssuerPhone" placeholder="000-0000-0000"></div>
                <div class="apply-field"><label>担当名</label><input id="businessIssuerContact" placeholder="山田太郎"></div>
                <div class="apply-field full"><label>登録番号・その他</label><input id="businessIssuerInfo" placeholder="インボイス登録番号"></div>
                <div class="apply-field"><label>支払・有効期限 Due date</label><div class="due-date-row"><input type="date" id="businessDue"><label class="due-date-nolabel"><input type="checkbox" id="businessNoDue"> 期限なし</label></div></div>
                <div class="apply-field"><label>デフォルト消費税 Default tax rate</label><select id="businessTaxRate" style="width:100%;"><option value="10">10%</option><option value="8">8%</option><option value="0">非課税・0%</option></select></div>
              </div>
              <div id="businessFinanceFields">
                <div class="section-title" style="margin-top:18px;">明細</div>
                <table class="business-items"><thead><tr><th>品目・内容</th><th>数量</th><th>単位</th><th>単価</th><th>税率</th></tr></thead><tbody id="businessItemRows"></tbody></table>
                <div style="text-align:center;margin-top:10px;"><button type="button" class="secondary-btn" id="businessAddRowBtn" style="width:32px;height:32px;font-size:18px;padding:0;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;">＋</button></div>
              </div>
              <div class="section-title" style="margin-top:18px;">本文・備考</div>
              <div class="apply-field full"><textarea id="businessBody" style="min-height:100px;" placeholder="取引条件、振込先、契約条項、目的、経緯、原因、再発防止策などを入力"></textarea></div>
            </div>
            <div>
              <div class="business-preview" id="businessDocPreview"></div>
              <div class="actions export-actions" data-export-target="businessDocPreview" data-export-name="ビジネス書類">
                <button type="button" class="btn-copy export-shot">📷 保存</button>
                <button type="button" class="secondary-btn" id="businessPdfBtn">📄 PDF</button>
                <button type="button" class="secondary-btn export-word">📝 Word</button>
                <button type="button" class="secondary-btn export-excel">📊 Excel</button>
              </div>
              <div class="footnote">契約書、NDA、覚書など法的効果を持つ文書は、取引内容に応じて弁護士・司法書士・行政書士等へ確認してください。<br>電子帳簿保存法、インボイス制度への適合も実際の保存・発行方法により異なります。</div>
            </div>
          </div>

    </section><!-- /doc-type-business -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script>
function routeEscape(value){
  return String(value ?? "").replace(/[&<>'"]/g,char => ({"&":"&amp;","<":"&lt;",">":"&gt;","'":"&#39;",'"':"&quot;"}[char]));
}
const toolYen = n => "¥" + Math.round(Number(n) || 0).toLocaleString("ja-JP");
const toolNum = id => Math.max(0,Number(document.getElementById(id)?.value) || 0);
const BUSINESS_NAMES={invoice:"請求書",receipt:"領収書",delivery:"納品書",order:"注文書",purchase:"発注書",payment:"支払明細書",contract:"業務委託契約書",memorandum:"覚書",nda:"秘密保持契約書",ringi:"稟議書",proposal:"企画書",suggestion:"提案書",incident:"顛末書",apology:"始末書","viewing-request":"内見申込書","move-in-application":"入居申込書","purchase-offer":"買付証明書"};
const BUSINESS_FINANCE=new Set(["invoice","receipt","delivery","order","purchase","payment"]);
const BUSINESS_TEMPLATES={
 contract:"第1条（目的）\n甲は乙に対し、下記業務を委託し、乙はこれを受託する。\n\n第2条（業務内容）\n\n第3条（委託料・支払条件）\n\n第4条（契約期間・解除）\n\n第5条（秘密保持・成果物・協議）",
 memorandum:"甲及び乙は、既存契約に関する下記事項について合意する。\n\n1. 変更・確認事項\n2. 適用開始日\n3. 本覚書に定めのない事項は原契約に従う。",
 nda:"甲及び乙は、検討・取引に伴い開示される秘密情報について、次のとおり合意する。\n\n1. 秘密情報の定義\n2. 目的外利用・第三者開示の禁止\n3. 例外情報\n4. 返還・廃棄\n5. 有効期間\n6. 協議・管轄",
 ringi:"【申請目的】\n\n【背景・必要性】\n\n【金額・予算】\n\n【実施期間】\n\n【期待効果・リスク】\n\n【承認依頼事項】",
 proposal:"【企画の背景】\n\n【目的・目標】\n\n【対象】\n\n【実施内容・スケジュール】\n\n【予算】\n\n【期待効果・測定方法】",
 suggestion:"【現状と課題】\n\n【提案内容】\n\n【導入手順】\n\n【費用】\n\n【期待効果】",
 incident:"【発生日時・場所】\n\n【発生した事実と経緯】\n\n【原因】\n\n【影響・対応結果】\n\n【再発防止策】",
 apology:"このたび、下記の件について関係者にご迷惑をおかけしました。事実を報告するとともに深く反省し、再発防止を徹底します。\n\n【発生日時・経緯】\n\n【原因】\n\n【反省・謝罪】\n\n【再発防止策】"
};
function addBusinessRow(){
  const row=document.createElement("tr");
  const defaultTax=document.getElementById("businessTaxRate").value;
  row.innerHTML=`<td><input class="biz-desc"></td><td><input class="biz-qty" type="number" min="0" step="0.01"></td><td><input class="biz-unit"></td><td><input class="biz-price" type="number" min="0" step="1"></td><td><input class="biz-tax" type="number" min="0" max="100" step="0.1" placeholder="0" value="${defaultTax}"></td>`;
  document.getElementById("businessItemRows").appendChild(row);
  row.querySelectorAll("input").forEach(el=>el.addEventListener("input",businessRender));
}
const businessRows=document.getElementById("businessItemRows");
if(businessRows){businessRows.innerHTML=Array.from({length:3},(_,i)=>`<tr><td><input class="biz-desc" value="${i===0?'サービス・商品':''}"></td><td><input class="biz-qty" type="number" value="${i===0?1:''}" min="0" step="0.01"></td><td><input class="biz-unit" value="${i===0?'式':''}"></td><td><input class="biz-price" type="number" value="${i===0?100000:''}" min="0" step="1"></td><td><input class="biz-tax" type="number" min="0" max="100" step="0.1" placeholder="0" value="10"></td></tr>`).join("");businessRows.querySelectorAll("input").forEach(el=>el.addEventListener("input",businessRender));}
document.getElementById("businessAddRowBtn")?.addEventListener("click",addBusinessRow);
function businessRender(){
  if (!document.querySelector("#businessFormCard")) return;
  const type=document.getElementById("businessDocType").value,name=BUSINESS_NAMES[type],isBroker=["viewing-request","move-in-application","purchase-offer"].includes(type),finance=BUSINESS_FINANCE.has(type),esc=routeEscape;
  if(isBroker){document.getElementById("businessDocPreview").innerHTML=`<div style="padding:20px;text-align:center;color:var(--ink-soft);">仲介用書類は別フォームで入力してください。<br><strong>${name}</strong></div>`;document.querySelector('[data-export-target="businessDocPreview"]').dataset.exportName=name;return;}
  document.getElementById("businessFinanceFields").style.display=finance?"block":"none";
  const items=[...document.querySelectorAll("#businessItemRows tr")].map(row=>({d:row.querySelector(".biz-desc").value,q:Number(row.querySelector(".biz-qty").value)||0,u:row.querySelector(".biz-unit").value,p:Number(row.querySelector(".biz-price").value)||0,t:Number(row.querySelector(".biz-tax").value)||0})).filter(x=>x.d||x.q||x.p);
  const subtotal=items.reduce((s,x)=>s+x.q*x.p,0),itemsTax=items.reduce((s,x)=>s+Math.floor(x.q*x.p*x.t/100),0),total=subtotal+itemsTax;
  const date=document.getElementById("businessDate").value,no=document.getElementById("businessNo").value,subject=document.getElementById("businessSubject").value,recipient=document.getElementById("businessRecipient").value,issuer=document.getElementById("businessIssuer").value,issuerAddr=document.getElementById("businessIssuerAddress").value,issuerPhone=document.getElementById("businessIssuerPhone").value,issuerContact=document.getElementById("businessIssuerContact").value,issuerInfo=document.getElementById("businessIssuerInfo").value,body=document.getElementById("businessBody").value,due=document.getElementById("businessDue").value,noDue=document.getElementById("businessNoDue").checked;
  const issuerLines=[esc(issuerAddr),esc(issuerPhone),esc(issuerContact),esc(issuerInfo)].filter(x=>x).join("<br>");
  const dueStr=(finance&&!noDue)?"期限："+esc(due):"";
  const recipientStr=esc(recipient)?`<strong>${esc(recipient)}</strong>`:"";
  const issuerStr=esc(issuer)?`<strong>${esc(issuer)}</strong>`:"";
  const noStr=esc(no)?`No. ${esc(no)}<br>`:"";
  const table=finance?`<table><thead><tr><th>品目・内容</th><th>数量</th><th>単位</th><th>単価</th><th>税率</th><th>金額</th></tr></thead><tbody>${items.map(x=>`<tr><td>${esc(x.d)}</td><td>${x.q}</td><td>${esc(x.u)}</td><td>${toolYen(x.p)}</td><td>${x.t}%</td><td>${toolYen(x.q*x.p+Math.floor(x.q*x.p*x.t/100))}</td></tr>`).join("")||'<tr><td colspan="6">明細を入力してください</td></tr>'}</tbody><tfoot><tr><th colspan="5">合計 税込み</th><td>${toolYen(total)}</td></tr></tfoot></table>`:"";
  document.getElementById("businessDocPreview").innerHTML=`<h2>${name}</h2><div class="business-preview-head"><div>${recipientStr}<br>${esc(subject)}${dueStr?`<br>${dueStr}`:""}</div><div>${esc(date)}<br>${noStr}${issuerStr}${issuerLines?`<br>${issuerLines}`:""}</div></div>${table}<div class="doc-body">${esc(body||"本文・備考を入力してください。")}</div>`;
  document.querySelector('[data-export-target="businessDocPreview"]').dataset.exportName=name;
}
function setBusinessTemplate(){const type=document.getElementById("businessDocType").value;document.getElementById("businessBody").value=BUSINESS_TEMPLATES[type]||"下記のとおりご案内いたします。\n\n振込先：\n備考：";}
document.querySelectorAll("#businessFormCard input,#businessFormCard select,#businessFormCard textarea").forEach(el=>el.addEventListener("input",businessRender));
document.getElementById("businessDocType")?.addEventListener("change",()=>{setBusinessTemplate();businessRender();});
document.getElementById("businessNoDue")?.addEventListener("change",businessRender);
document.getElementById("businessPdfBtn")?.addEventListener("click",async()=>{try{const canvas=await html2canvas(document.getElementById("businessDocPreview"),{scale:2,backgroundColor:"#fff",useCORS:true,delay:300,allowTaint:false,logging:false});const {jsPDF}=window.jspdf,pdf=new jsPDF({unit:"pt",format:"a4"}),w=pdf.internal.pageSize.getWidth(),h=canvas.height*(w-40)/canvas.width;pdf.addImage(canvas.toDataURL("image/png"),"PNG",20,20,w-40,Math.min(h,pdf.internal.pageSize.getHeight()-40));pdf.save(BUSINESS_NAMES[document.getElementById("businessDocType").value]+".pdf");}catch(e){alert("PDF生成に失敗しました。");}});
if(document.getElementById("businessDate")){const now=new Date(),due=new Date(now);due.setDate(due.getDate()+30);document.getElementById("businessDate").value=now.toISOString().slice(0,10);document.getElementById("businessDue").value=due.toISOString().slice(0,10);setBusinessTemplate();}businessRender();
</script>
