    #page-rent .lang-select{width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:var(--radius-sm);font-family:inherit;font-size:13px;font-weight:600;background:var(--white);color:var(--ink);}
    #page-rent .lang-select:focus{outline:2px solid var(--accent-2);outline-offset:1px;}

    #page-rent .input-tax-row{display:flex;align-items:center;flex-wrap:wrap;gap:5px 10px;margin-top:6px;}
    #page-rent .input-tax-row input[type=number]{flex:0 0 auto;width:140px;}
    #page-rent .input-tax-row .sub-input-wrap{margin-top:0;}
    #page-rent .input-tax-row .tax-check{margin-left:auto;}

    #page-rent .compact-pair{display:flex;gap:16px;padding:7px 0;border-bottom:1px dashed var(--line-soft);}
    #page-rent .compact-pair-item{flex:1;min-width:0;display:flex;align-items:center;justify-content:space-between;gap:8px;}
    #page-rent .compact-pair-item .compact-label{font-size:12.5px;color:var(--ink);line-height:1.3;}
    #page-rent .compact-pair-item .compact-label .hint{display:block;font-size:10.5px;color:var(--ink-soft);margin-top:2px;}
    #page-rent .compact-pair-item input{width:64px;flex-shrink:0;text-align:right;padding:8px 9px;border:1px solid var(--line);border-radius:var(--radius-sm);font-family:"JetBrains Mono",monospace;font-size:14px;background:var(--white);color:var(--ink);}

    #page-rent .fire-key-row .other-row .other-amount{flex:0 1 100px;}

    #page-rent .add-btn.mini{font-size:11.5px;padding:6px 9px;margin-top:8px;}

      .rent-subinput-label{font-size:12px;}
      .rent-lang-hint{font-size:12px;}
      .rent-client-line{font-size:13px;}
      .rent-property-line{font-size:14.5px;}
      #page-rent .section-title{font-size:15px;}

      #page-rent .mode-btn{font-size:11.5px;}

      #page-rent .compact-pair-item{gap:6px;}
      #page-rent .compact-pair-item .compact-label{font-size:12.5px;}
      #page-rent .date-field-row{grid-template-columns:1fr 172px;}
      #page-rent .fire-key-row{flex-direction:column;gap:0;}
      #page-rent .fire-key-row > .field-block,
      #page-rent .fire-key-row > .field-row{padding:7px 0;border-bottom:1px dashed var(--line-soft);}
      #page-rent .fire-key-row > .field-block:last-child,
      #page-rent .fire-key-row > .field-row:last-child{border-bottom:none;}
      #page-rent .input-tax-row{flex-direction:column;flex-wrap:nowrap;align-items:flex-end;gap:6px;}
      #page-rent .fire-key-row .input-tax-row{flex-wrap:nowrap;gap:6px;}
      #page-rent .input-tax-row .tax-check{margin-left:0;}
      #page-rent #guarantorAmountWrap,
      #page-rent #agencyAmountWrap{width:140px;}
      #page-rent .rent-two-col{flex-direction:column;gap:0;}
      #page-rent .rent-two-col .field-row{border-bottom:1px dashed var(--line-soft);padding:7px 0;}
      #page-rent .rent-two-col .field-row:last-child{border-bottom:none;}

  <div class="eyebrow">初期費用計算機</div>
  <div class="grid">
    <!-- INPUT PANEL -->
    <div class="card" id="formCard">
      <div class="section-title">費用項目（¥）</div>

      <div class="rent-two-col">
        <div class="field-row">
          <label>家賃</label>
          <input type="number" id="rent" value="0" min="0" step="1000">
        </div>
        <div class="field-row">
          <label>管理費・共益費</label>
          <input type="number" id="mgmt" value="0" min="0" step="500">
        </div>
      </div>
      <div class="rent-note"><strong>家賃</strong>　※合計には含まれません。礼金・敷金・仲介手数料の計算基準としてのみ使用します</div>

      <div class="field-block">
        <label>その他<span class="hint">駐車場代など自由に入力できます。初回保証利用料の基準（家賃+管理費+その他）にも加算されます</span></label>
        <div id="guarantorOtherRows"></div>
        <button type="button" class="add-btn mini" id="addGuarantorOtherBtn">＋ 追加</button>
      </div>

      <div class="fire-key-row">
        <div class="field-row date-field-row">
          <label>入居日（任意）<span class="hint">日割り計算に使用</span></label>
          <input type="date" id="moveInDate">
        </div>
        <div class="field-block">
          <label>入居月家賃<span class="hint">概算（月）または日割り計算</span></label>
          <div class="mode-toggle" id="modeToggle">
            <div class="mode-btn active" data-mode="months">概算（月）</div>
            <div class="mode-btn" data-mode="daily">日割り計算</div>
          </div>
          <div class="input-tax-row">
            <div id="monthsModeWrap" class="sub-input-wrap" style="display:flex;align-items:center;gap:8px;">
              <span class="rent-subinput-label">月数</span>
              <input type="number" id="firstRentMonths" value="1" min="0" step="1" style="width:64px;text-align:right;">
            </div>
            <div id="dailyModeWrap" class="sub-input-wrap" style="display:none;align-items:center;">
              <select id="dailyExtraMonths" style="width:200px;">
                <option value="1">当月のみ日割り（1ヶ月）</option>
                <option value="2">日割り＋翌月分（合計2ヶ月）</option>
              </select>
            </div>
          </div>
        </div>
      </div>

      <div class="compact-pair">
        <div class="compact-pair-item">
          <span class="compact-label">敷金（月）</span>
          <input type="number" id="depositMonths" value="1" min="0" step="0.5">
        </div>
        <div class="compact-pair-item">
          <span class="compact-label">礼金（月）</span>
          <input type="number" id="keyMoneyMonths" value="1" min="0" step="0.5">
        </div>
      </div>

      <div class="fire-key-row">
        <div class="field-block">
          <label>初回保証利用料<span class="hint">金額または割合で入力（非課税）</span></label>
          <div class="mode-toggle" id="guarantorModeToggle">
            <div class="mode-btn active" data-mode="percent">%（家賃+管理費+他）</div>
            <div class="mode-btn" data-mode="amount">金額</div>
          </div>
          <div class="input-tax-row">
            <div id="guarantorPercentWrap" class="sub-input-wrap" style="display:flex;align-items:center;gap:8px;">
              <span class="rent-subinput-label">(家賃+管理費+他) の %</span>
              <input type="number" id="guarantorPercent" value="50" min="0" step="5" style="width:70px;text-align:right;">
            </div>
            <div id="guarantorAmountWrap" class="sub-input-wrap" style="display:none;align-items:center;">
              <input type="number" id="guarantorAmount" value="40000" min="0" step="1000" style="text-align:right;">
            </div>
          </div>
        </div>

        <div class="field-block">
          <label>仲介手数料<span class="hint">金額または家賃に対する割合で入力</span></label>
          <div class="mode-toggle" id="agencyModeToggle">
            <div class="mode-btn active" data-mode="percent">%（家賃基準）</div>
            <div class="mode-btn" data-mode="amount">金額</div>
          </div>
          <div class="input-tax-row">
            <div id="agencyPercentWrap" class="sub-input-wrap" style="display:flex;align-items:center;gap:8px;">
              <span class="rent-subinput-label">家賃の %</span>
              <input type="number" id="agencyPercent" value="100" min="0" step="5" style="width:70px;text-align:right;">
            </div>
            <div id="agencyAmountWrap" class="sub-input-wrap" style="display:none;align-items:center;">
              <input type="number" id="agencyAmount" value="0" min="0" step="1000" style="text-align:right;">
            </div>
            <label class="tax-check mini"><input type="checkbox" id="agencyTax">税込み</label>
          </div>
        </div>
      </div>

      <div class="fire-key-row">
        <div class="field-block">
          <label>火災保険料<span class="hint">固定金額（非課税）</span></label>
          <div class="input-tax-row">
            <input type="number" id="insurance" value="20000" min="0" step="1000" style="text-align:right;">
          </div>
        </div>

        <div class="field-block">
          <label>鍵交換費用<span class="hint">固定金額</span></label>
          <div class="input-tax-row">
            <input type="number" id="keyExchange" value="0" min="0" step="1000" style="text-align:right;">
            <label class="tax-check mini"><input type="checkbox" id="keyExchangeTax">税込み</label>
          </div>
        </div>
      </div>

      <div class="fire-key-row">
        <div class="field-block">
          <label>生活サポート料金<span class="hint">月額または年額で設定</span></label>
          <div class="mode-toggle" id="lifesupportModeToggle">
            <div class="mode-btn active" data-mode="month">月額</div>
            <div class="mode-btn" data-mode="year">年額</div>
          </div>
          <div class="input-tax-row">
            <input type="number" id="lifesupportAmount" value="0" min="0" step="500" style="text-align:right;">
            <label class="tax-check mini"><input type="checkbox" id="lifesupportTax">税込み</label>
          </div>
        </div>

        <div class="field-block">
          <label>その他<span class="hint">複数行を自由に追加できます</span></label>
          <div id="otherRows"></div>
          <button type="button" class="add-btn" id="addOtherBtn">＋ 追加</button>
        </div>
      </div>
    </div>

    <!-- OUTPUT PANEL -->
    <div>
      <div class="card" style="margin-bottom:16px;">
        <div class="section-title">物件・情報</div>
        <div class="name-fields" style="margin-bottom:0;">
          <input type="text" id="propertyName" placeholder="物件名（任意）">
          <input type="text" id="clientName" placeholder="お名前（任意）">
        </div>
      </div>

      <div class="card" style="margin-bottom:16px;">
        <div class="section-title">出力言語</div>
        <select class="lang-select" id="langPicker" data-no-i18n>
          <option value="ja" selected>日本語</option>
          <option value="en">English</option>
          <option value="zh-CN">简体中文</option>
          <option value="zh-TW">繁體中文</option>
          <option value="ko">한국어</option>
          <option value="vi">Tiếng Việt</option>
        </select>
        <div class="rent-lang-hint">相手に送る言語を選択してください。</div>
      </div>

      <div class="receipt-card">
        <div class="receipt-head">
          <h2 id="receiptTitle">初期費用お見積り</h2>
          <div class="date" id="receiptDate"></div>
        </div>
        <div class="receipt-body">
          <div class="seal" id="sealMark">見積</div>
          <div id="clientLine" class="rent-client-line"></div>
          <div id="propertyLine" class="rent-property-line"></div>
          <div id="lineItems"></div>
        </div>
        <div class="receipt-total">
          <div class="label" id="totalLabel">合計</div>
          <div class="value" id="totalValue">¥0</div>
        </div>
        <div class="actions">
          <button class="btn-copy" id="copyBtn">📋 テキストをコピーする</button>
          <button class="btn-copy" id="screenshotBtn">📷 スクリーンショットを保存</button>
          <button class="secondary-btn" id="toggleSealBtn">🔲 見積を削除</button>
        </div>
        <div class="footnote" id="footnote"></div>
      </div>
    </div>
  </div>
  </div><!-- /page-rent -->

      agency: "Phí môi giới", firstRent: "Tiền thuê tháng đầu", guarantor: "Phí bảo lãnh ban đầu",
      insurance: "Bảo hiểm hỏa hoạn", keyexchange: "Phí thay khóa", lifesupport: "Phí hỗ trợ sinh hoạt", other: "Chi phí khác"
    }
  }
};

let currentLang = "ja";
let otherRowCounter = 0;
let guarantorOtherRowCounter = 0;

function yen(n){
  return "¥" + Math.round(n).toLocaleString("en-US");
}

function num(id){
  const el = document.getElementById(id);
  if (!el) return 0;
  const v = parseFloat(el.value);
  return isNaN(v) ? 0 : v;
}

function getMode(toggleId){
  const active = document.querySelector("#" + toggleId + " .mode-btn.active");
  return active ? active.dataset.mode : null;
}

function checked(id){
  const el = document.getElementById(id);
  return el ? el.checked : false;
}

function applyTax(amount, isTaxed){
  return amount;
}

function computeFirstRent(rent){
  const mode = getMode("modeToggle");
  if (mode === "daily"){
    const dateStr = document.getElementById("moveInDate").value;
    if (!dateStr) return {amount: 0, unit: "days", n: 0, extra: 1};
    const d = new Date(dateStr + "T00:00:00");
    const year = d.getFullYear(), month = d.getMonth();
    const daysInMonth = new Date(year, month + 1, 0).getDate();
    const dayOfMonth = d.getDate();
    const remainingDays = Math.max(0, daysInMonth - dayOfMonth + 1);
    const prorated = rent > 0 ? (rent / daysInMonth) * remainingDays : 0;
    const extraMonths = parseInt(document.getElementById("dailyExtraMonths").value, 10) || 1;
    const extraAmount = (extraMonths - 1) * rent;
    return {amount: prorated + extraAmount, unit: "days", n: remainingDays, extra: extraMonths};
  } else {
    const months = num("firstRentMonths");
    return {amount: rent * months, unit: "months", n: months, extra: 1};
  }
}

function computeAgency(rent){
  const mode = getMode("agencyModeToggle");
  if (mode === "percent"){
    return rent * (num("agencyPercent") / 100);
  }
  return num("agencyAmount");
}

function computeGuarantor(rent, mgmtRaw, guarantorOthersTotal){
  const mode = getMode("guarantorModeToggle");
  if (mode === "percent"){
    return (rent + mgmtRaw + guarantorOthersTotal) * (num("guarantorPercent") / 100);
  }
  return num("guarantorAmount");
}

function getOtherRows(){
  return Array.from(document.querySelectorAll("#otherRows .other-row")).map(row => {
    const label = row.querySelector(".other-label").value.trim();
    const raw = parseFloat(row.querySelector(".other-amount").value) || 0;
    const tax = row.querySelector(".other-tax").checked;
    return {label, raw, tax, amount: applyTax(raw, tax)};
  });
}

function getGuarantorOtherRows(){
  return Array.from(document.querySelectorAll("#guarantorOtherRows .other-row")).map(row => {
    const label = row.querySelector(".other-label").value.trim();
    const raw = parseFloat(row.querySelector(".other-amount").value) || 0;
    return {label, raw, amount: raw};
  });
}

function compute(){
  const rent = num("rent");

  const mgmt = num("mgmt");

  const deposit = rent * num("depositMonths");
  const keymoney = rent * num("keyMoneyMonths");

  const agencyRaw = computeAgency(rent);
  const agencyTax = checked("agencyTax");
  const agency = applyTax(agencyRaw, agencyTax);

  const firstRentInfo = computeFirstRent(rent);
  const firstRent = firstRentInfo.amount;

  const guarantorOthers = getGuarantorOtherRows();
  const guarantorOthersTotal = guarantorOthers.reduce((s, o) => s + o.amount, 0);
  const guarantor = computeGuarantor(rent, mgmt, guarantorOthersTotal);

  const insurance = num("insurance");

  const keyexchangeRaw = num("keyExchange");
  const keyexchangeTax = checked("keyExchangeTax");
  const keyexchange = applyTax(keyexchangeRaw, keyexchangeTax);

  const lifesupportRaw = num("lifesupportAmount");
  const lifesupportTax = checked("lifesupportTax");
  const lifesupport = applyTax(lifesupportRaw, lifesupportTax);
  const lifesupportMode = getMode("lifesupportModeToggle");

  const others = getOtherRows();
  const othersTotal = others.reduce((s, o) => s + o.amount, 0);

  const total = mgmt + deposit + keymoney + agency + firstRent + guarantor + guarantorOthersTotal + insurance + keyexchange + lifesupport + othersTotal;

  return {
    rent, mgmt, deposit, keymoney,
    agency, agencyTax,
    firstRent, firstRentInfo,
    guarantor, guarantorOthers,
    insurance,
    keyexchange, keyexchangeTax,
    lifesupport, lifesupportTax, lifesupportMode,
    others, total
  };
}

function buildLineData(vals, t){
  const lines = [];

  lines.push({label: `${t.items.rent} ${t.rentNote}`, amount: vals.rent, isRent: true});

  let frLabel = t.items.firstRent;
  const fr = vals.firstRentInfo;
  if (fr.unit === "days" && fr.n > 0){
    let suf = t.dayLabel(fr.n);
    if (fr.extra > 1) suf += " + " + t.monthLabel(fr.extra - 1);
    frLabel += ` (${suf})`;
  } else if (fr.unit === "months" && fr.n > 0){
    frLabel += ` (${t.monthLabel(fr.n)})`;
  }
  if (vals.firstRent > 0) lines.push({label: frLabel, amount: vals.firstRent});

  if (vals.mgmt > 0){
    lines.push({label: t.items.mgmt, amount: vals.mgmt});
  }
  vals.guarantorOthers.forEach(o => {
    if (o.raw > 0){
      lines.push({label: o.label || t.items.other, amount: o.amount});
    }
  });
  if (vals.deposit > 0) lines.push({label: t.items.deposit, amount: vals.deposit});
  if (vals.keymoney > 0) lines.push({label: t.items.keymoney, amount: vals.keymoney});

  if (vals.agency > 0){
    let l = t.items.agency + (vals.agencyTax ? " " + t.taxNote : "");
    lines.push({label: l, amount: vals.agency});
  }
  if (vals.guarantor > 0){
    lines.push({label: t.items.guarantor, amount: vals.guarantor});
  }
  if (vals.insurance > 0){
    lines.push({label: t.items.insurance, amount: vals.insurance});
  }
  if (vals.keyexchange > 0){
    let l = t.items.keyexchange + (vals.keyexchangeTax ? " " + t.taxNote : "");
    lines.push({label: l, amount: vals.keyexchange});
  }
  if (vals.lifesupport > 0){
    let unit = vals.lifesupportMode === "year" ? t.perYear : t.perMonth;
    let l = `${t.items.lifesupport} (${unit})` + (vals.lifesupportTax ? " " + t.taxNote : "");
    lines.push({label: l, amount: vals.lifesupport});
  }

  vals.others.forEach(o => {
    if (o.raw > 0){
      let l = (o.label || t.items.other) + (o.tax ? " " + t.taxNote : "");
      lines.push({label: l, amount: o.amount});
    }
  });

  return lines;
}

function render(){
  const t = T[currentLang];
  const vals = compute();
  const propertyName = document.getElementById("propertyName").value.trim();
  const clientName = document.getElementById("clientName").value.trim();

  document.getElementById("receiptTitle").textContent = t.title;
  document.getElementById("receiptDate").textContent = new Date().toISOString().slice(0,10);
  document.getElementById("sealMark").textContent = t.seal;
  document.getElementById("totalLabel").textContent = t.total;
  document.getElementById("totalValue").textContent = yen(vals.total);
  document.getElementById("footnote").textContent = t.footnote;
  document.getElementById("copyBtn").innerHTML = t.copy;
  document.getElementById("screenshotBtn").innerHTML = t.screenshot;

  document.getElementById("clientLine").textContent = clientName ? (t.client + ": " + clientName) : "";
  document.getElementById("propertyLine").textContent = propertyName ? (t.property + ": " + propertyName) : "";

  const lineData = buildLineData(vals, t);
  const itemsHtml = lineData.map(l => {
    const cls = l.isRent ? "receipt-line line-note" : "receipt-line";
    return `<div class="${cls}"><span>${l.label}</span><span class="amt">${yen(l.amount)}</span></div>`;
  }).join("");
  document.getElementById("lineItems").innerHTML = itemsHtml;
}

function buildCopyText(){
  const t = T[currentLang];
  const vals = compute();
  const propertyName = document.getElementById("propertyName").value.trim();
  const clientName = document.getElementById("clientName").value.trim();
  const lineData = buildLineData(vals, t);

  let lines = [];
  lines.push(t.title);
  if (propertyName) lines.push(`${t.property}: ${propertyName}`);
  if (clientName) lines.push(`${t.client}: ${clientName}`);
  lines.push("------------------------------");
  lineData.forEach(l => {
    lines.push(`${l.label}: ${yen(l.amount)}`);
  });
  lines.push("------------------------------");
  lines.push(`${t.total}: ${yen(vals.total)}`);
  lines.push("");
  lines.push(t.footnote);

  return lines.join("\n");
}

/* ---------- Mode toggle groups ---------- */
function bindModeToggle(toggleId, showMap){
  const toggle = document.getElementById(toggleId);
  toggle.querySelectorAll(".mode-btn").forEach(btn => {
    btn.addEventListener("click", () => {
      toggle.querySelectorAll(".mode-btn").forEach(b => b.classList.remove("active"));
      btn.classList.add("active");
      const mode = btn.dataset.mode;
      Object.keys(showMap).forEach(m => {
        const el = document.getElementById(showMap[m]);
        if (el) el.style.display = (m === mode) ? (el.dataset.showAs || "block") : "none";
      });
      render();
    });
  });
}

document.getElementById("monthsModeWrap").dataset.showAs = "flex";
document.getElementById("dailyModeWrap").dataset.showAs = "flex";
bindModeToggle("modeToggle", {months: "monthsModeWrap", daily: "dailyModeWrap"});

document.getElementById("agencyPercentWrap").dataset.showAs = "flex";
document.getElementById("agencyAmountWrap").dataset.showAs = "flex";
bindModeToggle("agencyModeToggle", {percent: "agencyPercentWrap", amount: "agencyAmountWrap"});

document.getElementById("guarantorPercentWrap").dataset.showAs = "flex";
document.getElementById("guarantorAmountWrap").dataset.showAs = "flex";
bindModeToggle("guarantorModeToggle", {percent: "guarantorPercentWrap", amount: "guarantorAmountWrap"});

bindModeToggle("lifesupportModeToggle", {});

/* ---------- Other rows (dynamic) ---------- */
function createOtherRow(label, amount, tax){
  otherRowCounter += 1;
  const row = document.createElement("div");
  row.className = "other-row";
  row.dataset.id = otherRowCounter;
  row.innerHTML = `
    <input type="text" class="other-label" placeholder="項目名" value="${label || ""}">
    <input type="number" class="other-amount" value="${amount || 0}" min="0" step="500">
    <label class="tax-check mini"><input type="checkbox" class="other-tax" ${tax ? "checked" : ""}> 税込み</label>
    <button type="button" class="remove-btn" title="削除">×</button>
  `;
  row.querySelector(".other-label").addEventListener("input", render);
  row.querySelector(".other-amount").addEventListener("input", render);
  row.querySelector(".other-tax").addEventListener("change", render);
  row.querySelector(".remove-btn").addEventListener("click", () => {
    row.remove();
    render();
  });
  document.getElementById("otherRows").appendChild(row);
}

document.getElementById("addOtherBtn").addEventListener("click", () => {
  createOtherRow("", 0, false);
  render();
});

/* ---------- Guarantor "other" rows (dynamic, non-taxable) ---------- */
function createGuarantorOtherRow(label, amount){
  guarantorOtherRowCounter += 1;
  const row = document.createElement("div");
  row.className = "other-row";
  row.dataset.id = guarantorOtherRowCounter;
  row.innerHTML = `
    <input type="text" class="other-label" placeholder="項目名（例：駐輪場代）" value="${label || ""}">
    <input type="number" class="other-amount" value="${amount || 0}" min="0" step="500">
    <button type="button" class="remove-btn" title="削除">×</button>
  `;
  row.querySelector(".other-label").addEventListener("input", render);
  row.querySelector(".other-amount").addEventListener("input", render);
  row.querySelector(".remove-btn").addEventListener("click", () => {
    row.remove();
    render();
  });
  document.getElementById("guarantorOtherRows").appendChild(row);
}

document.getElementById("addGuarantorOtherBtn").addEventListener("click", () => {
  createGuarantorOtherRow("", 0);
  render();
});

document.getElementById("langPicker")?.addEventListener("change", (e) => {

const formCard = document.getElementById("formCard");
formCard.addEventListener("input", (e) => {

  render();
});
formCard.addEventListener("change", render);

document.getElementById("propertyName").addEventListener("input", render);
document.getElementById("clientName").addEventListener("input", render);

/* ---------- Copy to clipboard ---------- */
window.addEventListener("scroll", () => {
  const active = document.activeElement;
  if (active && (active.tagName === "INPUT" || active.tagName === "SELECT" || active.tagName === "TEXTAREA")) {
    active.blur();
  }
}, { passive: true });
document.getElementById("copyBtn").addEventListener("click", () => {
  const text = buildCopyText();
  const t = T[currentLang];
  const btn = document.getElementById("copyBtn");
  const scrollX = window.scrollX, scrollY = window.scrollY;

  function flashCopied(){
    const original = t.copy;
    btn.textContent = t.copied;
    window.scrollTo(scrollX, scrollY);
    setTimeout(() => { btn.innerHTML = original; }, 1600);
  }

  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(flashCopied).catch(() => fallbackCopy(text, flashCopied));
  } else {
    fallbackCopy(text, flashCopied);
  }
});

/* ---------- Screenshot ---------- */
document.getElementById("screenshotBtn").addEventListener("click", async () => {
  const t = T[currentLang];
  const btn = document.getElementById("screenshotBtn");
  const original = t.screenshot;
  const scrollX = window.scrollX, scrollY = window.scrollY;
  try {
    const canvas = await html2canvas(document.querySelector(".receipt-card"), {scale: 2, backgroundColor: "#ffffff", useCORS: true, ignoreElements: el => el.classList?.contains("actions")});
    const link = document.createElement("a");
    link.download = "初期費用見積り_" + new Date().toISOString().slice(0,10) + ".png";
    link.href = canvas.toDataURL("image/png");
    link.click();
    btn.textContent = t.screenshotSaved;
  } catch (e) {
    btn.textContent = t.screenshotFailed;
  }
  window.scrollTo(scrollX, scrollY);
  setTimeout(() => { btn.innerHTML = original; }, 1600);
});

let sealVisible = true;
document.getElementById("toggleSealBtn").addEventListener("click", () => {
  const sealMark = document.getElementById("sealMark");
  const btn = document.getElementById("toggleSealBtn");
  sealVisible = !sealVisible;
  sealMark.style.display = sealVisible ? "block" : "none";
  btn.textContent = sealVisible ? "🔲 見積を削除" : "✓ 見積を表示";
});

function fallbackCopy(text, cb){
  const scrollX = window.scrollX, scrollY = window.scrollY;
  const ta = document.createElement("textarea");
  ta.value = text;
  ta.style.position = "fixed";
  ta.style.top = "0";
  ta.style.left = "0";
  ta.style.opacity = "0";
  document.body.appendChild(ta);
  ta.focus({ preventScroll: true });
  ta.select();
  try { document.execCommand("copy"); } catch(e) {}
  document.body.removeChild(ta);
  window.scrollTo(scrollX, scrollY);
  cb();
}

/* ---------- Init ---------- */
(function setDefaultDate(){
  const el = document.getElementById("moveInDate");
  if (el && !el.value){
    const today = new Date();
    el.value = today.toISOString().slice(0,10);
  }
})();

render();
