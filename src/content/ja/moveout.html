<div id="page-moveout" class="page-view active theme-rent cat-realestate" data-no-i18n>
    <style>
      .moveout-hero{display:grid;grid-template-columns:minmax(0,1.08fr) minmax(240px,.92fr);gap:18px;align-items:stretch;margin-bottom:18px;}
      .moveout-hero-main{border:1px solid var(--line);background:linear-gradient(135deg,#fff 0%,#f6f1e8 100%);padding:24px;min-width:0;}
      .moveout-hero-main h2{font-family:"Shippori Mincho",serif;font-size:25px;line-height:1.35;margin:0 0 10px;color:var(--ink);letter-spacing:.04em;}
      .moveout-hero-main p{font-size:13px;line-height:1.9;color:var(--ink-soft);margin:0;}
      .moveout-hero-visual{border:1px solid var(--line);background:#fff;padding:18px;display:grid;gap:10px;align-content:center;}
      .moveout-visual-row{display:grid;grid-template-columns:minmax(0,1fr);gap:10px;align-items:center;padding:9px 10px;border:1px solid var(--line-soft);background:var(--paper);}
      .moveout-visual-row b{display:block;font-size:12px;color:var(--ink);line-height:1.35;}
      .moveout-visual-row small{display:block;font-size:10.5px;color:var(--ink-soft);line-height:1.45;margin-top:1px;}
      .moveout-cost-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-bottom:16px;}
      .moveout-cost-card{border:1px solid var(--line);background:#fff;padding:16px;position:relative;min-width:0;}
      .moveout-cost-card .badge{font-family:"JetBrains Mono",monospace;font-size:10px;color:var(--accent);font-weight:700;margin-bottom:8px;}
      .moveout-cost-card h3{font-size:14px;margin:0 0 8px;color:var(--ink);}
      .moveout-cost-card p{font-size:11.5px;line-height:1.75;color:var(--ink-soft);margin:0;}
      .moveout-cost-card strong{display:block;margin-top:9px;font-size:12px;color:var(--seal);}
      .moveout-rule-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;margin-bottom:16px;}
      .moveout-rule{border:1px solid var(--line);background:#fff;padding:16px;}
      .moveout-rule.good{border-left:4px solid var(--accent);}
      .moveout-rule.bad{border-left:4px solid var(--seal);}
      .moveout-rule h3{margin:0 0 9px;font-size:14px;}
      .moveout-rule ul{margin:0;padding-left:18px;display:grid;gap:6px;}
      .moveout-rule li{font-size:12px;line-height:1.75;color:var(--ink-soft);}
      .moveout-table{width:100%;border-collapse:collapse;font-size:12px;background:#fff;margin:8px 0 0;}
      .moveout-table th,.moveout-table td{border:1px solid var(--line);padding:9px;text-align:left;vertical-align:top;}
      .moveout-table th{background:var(--paper-2);color:var(--accent);font-size:11px;}
      .moveout-calc{display:grid;grid-template-columns:minmax(0,.96fr) minmax(0,1.04fr);gap:14px;align-items:start;margin-bottom:16px;}
      .moveout-calc-panel,.moveout-damage-panel{border:1px solid var(--line);background:#fff;padding:16px;min-width:0;}
      .moveout-input-row{display:grid;grid-template-columns:minmax(0,1fr) 170px;gap:10px;align-items:center;padding:8px 0;border-bottom:1px dashed var(--line-soft);}
      .moveout-input-row label{font-size:12px;color:var(--ink);line-height:1.5;}

      .moveout-input-row input{font-family:"JetBrains Mono",monospace;text-align:right;}
      .moveout-period-pair{display:grid;grid-template-columns:1fr 1fr;gap:6px;}
      .moveout-damage-list{display:grid;gap:9px;margin-top:10px;}
      .moveout-damage-card{display:grid;grid-template-columns:24px minmax(0,1fr) minmax(145px,.45fr);gap:9px;align-items:start;border:1px solid var(--line);background:var(--paper);padding:10px;}
      .moveout-damage-card input{width:17px;height:17px;margin-top:3px;accent-color:var(--accent);}
      .moveout-damage-card b{display:block;font-size:12px;color:var(--ink);line-height:1.45;}
      .moveout-damage-card small{display:block;font-size:10.5px;line-height:1.55;color:var(--ink-soft);margin-top:2px;}
      .moveout-calc button{margin-top:12px;border:1px solid var(--accent);background:var(--accent);color:#fff;padding:9px 14px;font-weight:700;cursor:pointer;}
      .moveout-result{border:1px solid rgba(52,79,61,.28);background:rgba(52,79,61,.06);padding:16px;display:grid;gap:8px;}
      .moveout-result span{font-size:11px;color:var(--ink-soft);line-height:1.55;}
      .moveout-result strong{font-family:"JetBrains Mono",monospace;font-size:24px;color:var(--accent);line-height:1.25;}
      .moveout-breakdown{margin:0;padding-left:17px;display:grid;gap:5px;font-size:11.5px;color:var(--ink-soft);line-height:1.65;}
      .moveout-timeline{display:grid;gap:10px;margin-top:8px;}
      .moveout-step{display:grid;grid-template-columns:108px minmax(0,1fr);gap:12px;border:1px solid var(--line);background:#fff;padding:12px;}
      .moveout-step time{font-size:11px;font-weight:700;color:var(--accent);line-height:1.5;}
      .moveout-step b{display:block;font-size:12.5px;margin-bottom:3px;color:var(--ink);}
      .moveout-step span{display:block;font-size:11.5px;line-height:1.75;color:var(--ink-soft);}
      .moveout-note{border-left:3px solid var(--gold);background:rgba(156,122,60,.08);padding:11px 13px;font-size:11.5px;line-height:1.8;color:var(--ink-soft);margin-top:14px;}
      .moveout-life-intro{font-size:12.5px;line-height:1.9;color:var(--ink-soft);margin:0 0 10px;}
      .moveout-damage-title{font-size:14px;margin:0 0 6px;color:var(--accent);}
      .moveout-damage-intro{font-size:11.5px;line-height:1.75;color:var(--ink-soft);margin:0;}
      @media(max-width:860px){.moveout-hero,.moveout-cost-grid,.moveout-rule-grid,.moveout-calc{grid-template-columns:1fr}.moveout-step{grid-template-columns:92px 1fr}}
      @media(max-width:560px){.moveout-hero-main{padding:18px}.moveout-hero-main h2{font-size:21px}.moveout-input-row,.moveout-step,.moveout-damage-card{grid-template-columns:1fr}.moveout-period-pair{grid-template-columns:1fr 1fr}.moveout-cost-card,.moveout-rule,.moveout-calc-panel,.moveout-damage-panel,.moveout-result{padding:14px}}

        .moveout-hero-main p{font-size:14px;}
        .moveout-visual-row b{font-size:13.5px;}
        .moveout-visual-row small{font-size:12px;}
        .moveout-cost-card .badge{font-size:11px;}
        .moveout-cost-card h3{font-size:15px;}
        .moveout-cost-card p{font-size:13px;}
        .moveout-cost-card strong{font-size:13px;}
        .moveout-rule h3{font-size:15px;}
        .moveout-rule li{font-size:13px;}
        .moveout-table,.moveout-table th,.moveout-table td{font-size:13px;}
        .moveout-calc-panel,.moveout-damage-panel{padding:12px;}
        .moveout-input-row{grid-template-columns:1fr;gap:6px;padding:7px 0;}
        .moveout-input-row label{font-size:12.5px;}
        .moveout-input-row input,.moveout-input-row select,.moveout-damage-card select{font-size:13px;padding:6px 7px;}
        .moveout-damage-card{grid-template-columns:20px minmax(0,1fr);gap:6px;padding:8px;}
        .moveout-damage-card select{grid-column:1 / -1;margin-top:6px;width:100%;}
        .moveout-damage-card b{font-size:12.5px;}
        .moveout-damage-card small{font-size:11px;}
        .moveout-damage-list{gap:7px;}
        .moveout-result span{font-size:12.5px;}
        .moveout-result strong{font-size:22px;}
        .moveout-breakdown{font-size:13px;}
        .moveout-step time{font-size:12.5px;}
        .moveout-step b{font-size:14px;}
        .moveout-step span{font-size:13px;}
        .moveout-note{font-size:13px;}
        .moveout-life-intro{font-size:13px;}
        .moveout-damage-title{font-size:14px;}
        .moveout-damage-intro{font-size:12.5px;}
      }
    </style>

              {id:"mold", label:"發霉、水回清潔不足", note:"超過一般清掃的除霉，或疑似通風不足、結露未處理。", options:[["","請選擇",0],["light","輕度：浴室或窗邊追加清潔",8000],["medium","中度：牆、收納、窗邊多處處理",25000],["heavy","重度：需要換壁紙或確認底層",60000]]},
              {id:"smoke", label:"吸菸造成泛黃、異味", note:"室內吸菸很容易變成大範圍壁紙重貼與消臭費。", options:[["","請選擇",0],["odor","只有消臭處理",20000],["partial","部分壁紙重貼 + 消臭",65000],["full","全室壁紙重貼 + 消臭",120000]]},
              {id:"key", label:"鑰匙遺失、破損", note:"鑰匙少還、卡片鑰匙、鎖芯交換等。", options:[["","請選擇",0],["copy","一般鑰匙 1 支再發行目安",5000],["card","卡片鑰匙再發行目安",12000],["cylinder","鎖芯交換目安",25000]]}
            ]
          }
        };

        function langCopy(lang){
          return lang === "zh-TW" || lang === "zh-CN" ? MOVEOUT_COPY["zh-TW"] : MOVEOUT_COPY.ja;
        }
        function esc(text){
          return String(text == null ? "" : text).replace(/[&<>"']/g,function(ch){return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[ch];});
        }
        function yen(value){
          return Math.round(value).toLocaleString("ja-JP") + " 円";
        }
        function renderMoveout(lang){
          var c = langCopy(lang || (typeof siteCurrentLanguage !== "undefined" ? siteCurrentLanguage : "ja"));
          mount.innerHTML = ''
            + '<div class="eyebrow">' + esc(c.eyebrow) + '</div>'
            + '<section class="moveout-hero" aria-labelledby="moveoutTitle">'
            + '<div class="moveout-hero-main"><h2 id="moveoutTitle">' + esc(c.title) + '</h2><p>' + esc(c.intro) + '</p></div>'
            + '<div class="moveout-hero-visual" aria-label="' + esc(c.title) + '">' + c.visual.map(function(v){return '<div class="moveout-visual-row"><div><b>' + esc(v[1]) + '</b><small>' + esc(v[2]) + '</small></div></div>';}).join('') + '</div>'
            + '</section>'
            + '<section class="card" style="margin-bottom:16px;"><div class="section-title"><span class="idx">01</span><span>' + esc(c.costTitle) + '</span></div><div class="moveout-cost-grid">'
            + c.costs.map(function(item){return '<article class="moveout-cost-card"><div class="badge">' + esc(item[0]) + '</div><h3>' + esc(item[1]) + '</h3><p>' + esc(item[2]) + '</p><strong>' + esc(item[3]) + '</strong></article>';}).join('')
            + '</div><div class="moveout-note">' + esc(c.cleaningNote) + '</div></section>'
            + '<section class="moveout-rule-grid" aria-label="' + esc(c.landlordTitle) + '"><div class="moveout-rule good"><h3>' + esc(c.landlordTitle) + '</h3><ul>' + c.landlord.map(function(x){return '<li>' + esc(x) + '</li>';}).join('') + '</ul></div><div class="moveout-rule bad"><h3>' + esc(c.tenantTitle) + '</h3><ul>' + c.tenant.map(function(x){return '<li>' + esc(x) + '</li>';}).join('') + '</ul></div></section>'
            + '<section class="card" style="margin-bottom:16px;"><div class="section-title"><span class="idx">02</span><span>' + esc(c.lifeTitle) + '</span></div><p class="moveout-life-intro">' + esc(c.lifeIntro) + '</p><table class="moveout-table"><thead><tr>' + c.lifeHead.map(function(h){return '<th>' + esc(h) + '</th>';}).join('') + '</tr></thead><tbody>' + c.lifeRows.map(function(row){return '<tr>' + row.map(function(cell){return '<td>' + esc(cell) + '</td>';}).join('') + '</tr>';}).join('') + '</tbody></table></section>'
            + '<section class="moveout-calc" aria-labelledby="moveoutCalcTitle"><div class="moveout-calc-panel"><div class="section-title"><span class="idx">03</span><span id="moveoutCalcTitle">' + esc(c.calcTitle) + '</span></div>'
            + '<div class="moveout-input-row"><label for="moveoutRepairCost">' + esc(c.baseCost) + '<span class="hint">' + esc(c.baseCostHint) + '</span></label><input id="moveoutRepairCost" type="number" min="0" value="0" inputmode="numeric"></div>'
            + '<div class="moveout-input-row"><label>' + esc(c.period) + '</label><div class="moveout-period-pair"><select id="moveoutYears">' + Array.from({length:11},function(_,i){return '<option value="' + i + '"' + (i===2?' selected':'') + '>' + i + ' ' + esc(c.years) + '</option>';}).join('') + '</select><select id="moveoutExtraMonths">' + Array.from({length:12},function(_,i){return '<option value="' + i + '">' + i + ' ' + esc(c.months) + '</option>';}).join('') + '</select></div></div>'
            + '<button type="button" id="moveoutCalcBtn">' + esc(c.calcButton) + '</button></div>'
            + '<div class="moveout-damage-panel"><h3 class="moveout-damage-title">' + esc(c.damageTitle) + '</h3><p class="moveout-damage-intro">' + esc(c.damageIntro) + '</p><div class="moveout-damage-list">' + c.damageOptions.map(function(item){return '<label class="moveout-damage-card"><input type="checkbox" data-damage-check="' + esc(item.id) + '"><span><b>' + esc(item.label) + '</b><small>' + esc(item.note) + '</small></span><select data-damage-select="' + esc(item.id) + '">' + item.options.map(function(opt){return '<option value="' + esc(opt[2]) + '">' + esc(opt[1]) + '</option>';}).join('') + '</select></label>';}).join('') + '</div></div>'
            + '</section><div class="moveout-result" id="moveoutCalcResult" aria-live="polite"></div>'
            + '<section class="card" style="margin-top:16px;"><div class="section-title"><span class="idx">04</span><span>' + esc(c.scheduleTitle) + '</span></div><div class="moveout-timeline">' + c.schedule.map(function(s){return '<div class="moveout-step"><time>' + esc(s[0]) + '</time><div><b>' + esc(s[1]) + '</b><span>' + esc(s[2]) + '</span></div></div>';}).join('') + '</div><div class="moveout-note">' + esc(c.finalNote) + '</div></section>';
          bindMoveoutCalc(c);
        }
        function bindMoveoutCalc(c){
          var result = document.getElementById("moveoutCalcResult");
          var inputs = ["moveoutRepairCost","moveoutYears","moveoutExtraMonths"].map(function(id){return document.getElementById(id);});
          var damageChecks = Array.from(document.querySelectorAll("[data-damage-check]"));
          var damageSelects = Array.from(document.querySelectorAll("[data-damage-select]"));
          function calc(){
            var manual = Math.max(0, Number(document.getElementById("moveoutRepairCost").value) || 0);
            var years = Math.max(0, Number(document.getElementById("moveoutYears").value) || 0);
            var extraMonths = Math.max(0, Number(document.getElementById("moveoutExtraMonths").value) || 0);
            var months = years * 12 + extraMonths;
            var ratio = months >= 72 ? 0.01 : Math.max(0.01, (72 - months) / 72);
            var selectedTotal = 0;
            var lines = [];
            c.damageOptions.forEach(function(item){
              var check = document.querySelector('[data-damage-check="' + item.id + '"]');
              var select = document.querySelector('[data-damage-select="' + item.id + '"]');
              var amount = check && check.checked && select ? Number(select.value) || 0 : 0;
              if(amount > 0){
                selectedTotal += amount;
                var selectedText = select.options[select.selectedIndex].textContent;
                lines.push(esc(item.label + " - " + selectedText + ": " + yen(amount)));
              }
            });
            var repairTotal = manual + selectedTotal;
            var amount = repairTotal * ratio;
            result.innerHTML = '<span>' + esc(c.resultLead) + '</span><strong>' + yen(amount) + '</strong><span>' + esc(c.ratio) + ': ' + (ratio * 100).toFixed(1) + '% / ' + esc(c.repairTotal) + ': ' + yen(repairTotal) + '</span><ul class="moveout-breakdown">' + (manual > 0 ? '<li>' + esc(c.manual) + ': ' + yen(manual) + '</li>' : '') + (lines.length ? lines.map(function(x){return '<li>' + x + '</li>';}).join('') : '<li>' + esc(c.noItem) + '</li>') + '</ul>';
          }
          inputs.forEach(function(input){ if(input) input.addEventListener("input",calc); if(input) input.addEventListener("change",calc); });
          damageChecks.forEach(function(check){ check.addEventListener("change",function(){ var select = document.querySelector('[data-damage-select="' + check.dataset.damageCheck + '"]'); if(check.checked && select && Number(select.value) === 0 && select.options.length > 1) select.selectedIndex = 1; calc(); }); });
          damageSelects.forEach(function(select){ select.addEventListener("change",function(){ var check = document.querySelector('[data-damage-check="' + select.dataset.damageSelect + '"]'); if(check) check.checked = Number(select.value) > 0; calc(); }); });
          var button = document.getElementById("moveoutCalcBtn");
          if(button) button.addEventListener("click",calc);
          calc();
        }
        window.siteApplyMoveoutCopy = renderMoveout;
        renderMoveout(typeof siteCurrentLanguage !== "undefined" ? siteCurrentLanguage : "ja");
      })();
    </script>
  </div><!-- /page-moveout -->
